<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP Activity Log</title><link rel="stylesheet" href="public/common.css"><link rel="stylesheet" href="public/core/styles/erp-runtime.css"><link rel="stylesheet" href="public/core/styles/erp-platform-runtime.css"><script src="public/common-shell-settings.js"></script><script src="public/common-shell-engine.js"></script><script src="public/core/erp-module-registry.js"></script><script src="public/core/erp-platform-runtime.js" defer></script></head><body data-erp-page="activity-log"><div id="appSidebar"></div><main class="app-main" style="max-width:1180px;margin:25px auto;padding:20px"><section style="background:#112b4d;color:white;padding:24px;border-radius:16px"><h1 style="margin:0 0 8px">ERP Activity Log</h1><p style="margin:0">Review system changes, page activity, settings updates and runtime events.</p></section><section style="background:white;margin-top:16px;padding:18px;border-radius:16px"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><input id="q" placeholder="Search activity..." style="flex:1;min-width:260px;padding:11px;border:1px solid #ccd6e4;border-radius:10px"><button onclick="render()">Refresh</button><button onclick="ERPActivity.export()">Export JSON</button><button onclick="clearLog()">Clear</button></div><div id="rows"></div></section></main><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function render(){const s=(q.value||"").toLowerCase(),a=(ERPActivity?.getAll?.()||[]).filter(r=>JSON.stringify(r).toLowerCase().includes(s));rows.innerHTML=a.length?a.map(r=>`<article style="border-bottom:1px solid #e5ebf2;padding:12px 4px"><strong>${esc(r.action)}</strong><div style="color:#64748b;margin-top:4px">${esc(r.page)} · ${esc(r.user)} · ${new Date(r.createdAt).toLocaleString()}</div><pre style="white-space:pre-wrap;background:#f4f7fb;padding:10px;border-radius:8px">${esc(JSON.stringify(r.detail,null,2))}</pre></article>`).join(""):"<p>No activity recorded.</p>"}function clearLog(){if(confirm("Clear the activity log?")){ERPActivity.clear();render()}}q.addEventListener("input",render);window.addEventListener("erp:runtime-ready",render);setTimeout(render,600);
</script></body></html>
