<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raw Material Summary</title><link rel="stylesheet" href="public/common.css">
<script src="public/common-tools.js"></script>
<script src="public/theme-settings.js"></script>
<script src="public/common-theme-manager.js"></script>
<script src="public/common-shell-engine.js"></script>
<script src="public/page-renderer.js"></script>
<script src="public/design-studio-bootstrap.js"></script>
<script src="public/common-font-controller.js"></script>
<link rel="stylesheet" href="public/core/styles/erp-runtime.css">
<link rel="stylesheet" href="public/core/styles/erp-platform-runtime.css">
<script src="public/core/erp-runtime.js"></script>
<script src="public/core/erp-registry.js"></script>
<script src="public/core/erp-module-registry.js"></script>
<script src="public/core/erp-platform-runtime.js" defer></script><link rel="stylesheet" href="costing-v2.css"><script src="costing-v2-store.js"></script></head><body data-erp-page="raw-material-summary"><div id="appSidebar"></div><main class="app-main app-page">
<div class="page-head"><div><h1>Raw Material Summary</h1><p>Date-wise and material-wise movement, rates and consumption value.</p></div><div class="actions"><a class="btn" href="costing.html">Dashboard</a><a class="btn" href="consumption-report.html">Consumption Report</a><button class="btn" onclick="print()">Print PDF</button></div></div>
<section class="panel no-print"><div class="toolbar"><div class="field"><label>From Date</label><input id="from" class="input" type="date"></div><div class="field"><label>To Date</label><input id="to" class="input" type="date"></div><div class="field"><label>Cost Group</label><select id="group" class="select"><option value="">All Groups</option></select></div><div class="field" style="min-width:230px"><label>Material</label><select id="material" class="select"><option value="">All Materials</option></select></div><div class="field"><label>View Type</label><select id="viewType" class="select"><option value="date">Date-wise</option><option value="material">Material-wise</option></select></div><button id="show" class="btn primary">Show Summary</button></div></section>
<section class="grid metrics"><div class="metric"><label>Total Received</label><strong id="sReceived">0.000</strong></div><div class="metric"><label>Pulp Unit</label><strong id="sPulp">0.000</strong></div><div class="metric"><label>Boiler</label><strong id="sBoiler">0.000</strong></div><div class="metric"><label>PM Total</label><strong id="sPM">0.000</strong></div><div class="metric"><label>Total Consumed</label><strong id="sTotal">0.000</strong></div><div class="metric"><label>Consumption Value</label><strong id="sValue">Rs 0.00</strong></div></section>
<section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Material</th><th>Group</th><th>Opening</th><th>Received</th><th>Pulp Unit</th><th>Boiler</th><th>PM-1</th><th>PM-2</th><th>PM-3</th><th>Total</th><th>Closing</th><th>Rate</th><th>Value</th></tr></thead><tbody id="sumBody"></tbody></table></div></section>
<script>
const mats=CostingV2.materials().filter(x=>!x.system&&x.active!==false);const gs=[...new Set(mats.map(x=>x.group))];group.innerHTML+=gs.map(x=>`<option>${x}</option>`).join('');function fillM(){material.innerHTML='<option value="">All Materials</option>'+mats.filter(x=>!group.value||x.group===group.value).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}group.onchange=fillM;fillM();const now=new Date().toISOString().slice(0,10);from.value=now.slice(0,8)+'01';to.value=now;
function run(){let rows=[],tot={received:0,pulp:0,boiler:0,pm:0,total:0,value:0};CostingV2.inRange(from.value,to.value).forEach(e=>mats.filter(x=>(!group.value||x.group===group.value)&&(!material.value||x.id===material.value)).forEach(m=>{const z=e.materials?.[m.id]||{},p=CostingV2.n(z.pulp),b=CostingV2.n(z.boiler),p1=CostingV2.n(z.pm1),p2=CostingV2.n(z.pm2),p3=CostingV2.n(z.pm3),t=p+b+p1+p2+p3,o=CostingV2.n(z.opening),r=CostingV2.n(z.received),c=o+r-t,rate=CostingV2.effectiveRate(m.id,e.date)?.rate||0,val=t*rate;if(o||r||t){rows.push({date:e.date,m,o,r,p,b,p1,p2,p3,t,c,rate,val});tot.received+=r;tot.pulp+=p;tot.boiler+=b;tot.pm+=p1+p2+p3;tot.total+=t;tot.value+=val}}));if(viewType.value==='material')rows.sort((a,b)=>a.m.name.localeCompare(b.m.name)||a.date.localeCompare(b.date));else rows.sort((a,b)=>a.date.localeCompare(b.date)||a.m.sequence-b.m.sequence);sumBody.innerHTML=rows.map(x=>`<tr><td>${x.date}</td><td>${x.m.name}</td><td>${x.m.group}</td><td>${x.o.toFixed(3)}</td><td>${x.r.toFixed(3)}</td><td>${x.p.toFixed(3)}</td><td>${x.b.toFixed(3)}</td><td>${x.p1.toFixed(3)}</td><td>${x.p2.toFixed(3)}</td><td>${x.p3.toFixed(3)}</td><td>${x.t.toFixed(3)}</td><td>${x.c.toFixed(3)}</td><td>${x.rate.toFixed(2)}</td><td>Rs ${x.val.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>`).join('')||'<tr><td colspan="14" class="center muted">No records found.</td></tr>';sReceived.textContent=tot.received.toFixed(3);sPulp.textContent=tot.pulp.toFixed(3);sBoiler.textContent=tot.boiler.toFixed(3);sPM.textContent=tot.pm.toFixed(3);sTotal.textContent=tot.total.toFixed(3);sValue.textContent='Rs '+tot.value.toLocaleString(undefined,{minimumFractionDigits:2})}show.onclick=run;
</script></main></body></html>
