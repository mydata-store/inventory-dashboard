<style>
:root{--ink:#0f1e35;--orange:#ffb000;--line:#c9d2df;--soft:#f5f8fc;--green:#0f9f6e}
.cost-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.cost-tab{border:1px solid #cbd5e1;background:#fff;padding:11px 16px;border-radius:9px;font-weight:800;cursor:pointer}.cost-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.filter-panel{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:14px 16px;box-shadow:0 8px 22px rgba(15,30,53,.06);margin-bottom:14px}.filter-grid{display:grid;grid-template-columns:repeat(5,minmax(145px,1fr));gap:12px;align-items:end}.filter-mode{display:none}.filter-mode.active{display:contents}.field label{display:block;font-size:11px;font-weight:900;color:#334155;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn.dark{background:var(--ink);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.light{background:#fff;border:1px solid #cbd5e1;color:#0f172a}
.report-paper{background:#fff;border:1px solid #b8c3d1;box-shadow:0 10px 30px rgba(15,30,53,.12);max-width:1460px;margin:auto}.report-head{display:flex;justify-content:space-between;gap:15px;padding:18px 20px 12px;border-bottom:3px solid var(--ink)}.report-head h2{margin:0;font-size:25px}.report-head p{margin:4px 0 0;color:#64748b;font-size:12px}.report-date{text-align:right;font-weight:800}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--ink)}.summary-box{border-right:1px solid #94a3b8}.summary-box:last-child{border-right:0}.summary-title{background:var(--orange);padding:8px 12px;font-weight:900;text-transform:uppercase;text-align:center}.summary-row{display:grid;grid-template-columns:1.4fr .8fr .8fr;border-top:1px solid #d7dee8}.summary-row span{padding:7px 9px;font-size:12px;border-right:1px solid #e2e8f0}.summary-row span:last-child{border-right:0;text-align:right}.summary-row .label{font-weight:700}.summary-head{font-weight:900;background:#f1f5f9}.report-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #cbd5e1}.report-tools label{font-size:12px;font-weight:800}.kpis{display:flex;gap:8px;flex-wrap:wrap}.kpi{padding:7px 10px;border:1px solid #dbe3ee;border-radius:8px;background:#fff;font-size:11px}.kpi b{display:block;font-size:15px;color:var(--ink)}
.cost-table{width:100%;border-collapse:collapse;font-size:12px}.cost-table th{background:var(--orange);color:#111827;padding:8px 7px;border:1px solid #826200;position:sticky;top:0;z-index:2}.cost-table td{padding:7px;border:1px solid #cbd5e1}.cost-table .num{text-align:right;font-variant-numeric:tabular-nums}.group-row td{background:#1b304f;color:#fff;font-weight:900;padding:7px 10px}.group-total td{background:#fff4cf;font-weight:900}.grand-total td{background:#0f1e35;color:#fff;font-weight:900;font-size:13px}.zero-note{padding:40px;text-align:center;color:#64748b}.remarks{min-width:140px}.source{font-size:10px;border-radius:999px;padding:3px 7px;background:#eaf2ff;color:#1e40af;font-weight:800}.source.manual{background:#fff4d6;color:#92400e}.source.formula{background:#e7f8ef;color:#166534}
.footer-summary{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:18px 20px;border-top:2px solid #0f1e35}.mini-box h3{margin:0 0 8px}.mini-line{display:flex;justify-content:space-between;border-bottom:1px solid #cbd5e1;padding:6px 0;font-weight:700}.print-footer{display:none;text-align:center;font-size:10px;padding:8px}
@media(max-width:1050px){.filter-grid{grid-template-columns:repeat(2,1fr)}.summary-grid{grid-template-columns:1fr}.summary-box{border-right:0;border-bottom:1px solid #94a3b8}.footer-summary{grid-template-columns:1fr}.report-paper{overflow:auto}}
@media print{body{background:#fff}.app-main{margin:0!important;padding:0!important}.page-head,.filter-panel,.cost-tabs,.report-tools,#appSidebar{display:none!important}.report-paper{box-shadow:none;border:0;max-width:none}.cost-table th{position:static}.print-footer{display:block}.report-head{padding-top:8px}@page{size:A4 landscape;margin:8mm}}

<body data-erp-page="cost-report"><div id="appSidebar"></div>
<main class="app-main app-page">
<div class="page-head"><div><h1>Cost Report</h1><p>Daily, monthly and date-range manufacturing cost calculated from saved consumption and master rates.</p></div><a class="btn dark" href="costing.html">← Costing Dashboard</a></div>
<div class="cost-tabs"><button class="cost-tab active" data-mode="daily">Daily Cost</button><button class="cost-tab" data-mode="monthly">Monthly Cost</button><button class="cost-tab" data-mode="range">From–To Date Cost</button></div>
<section class="filter-panel"><div class="filter-grid">
<div class="filter-mode active" data-panel="daily"><div class="field"><label>Date</label><input id="dailyDate" placeholder="25-6"></div></div>
<div class="filter-mode" data-panel="monthly"><div class="field"><label>Month</label><select id="month"></select></div><div class="field"><label>Year</label><select id="year"></select></div></div>
<div class="filter-mode" data-panel="range"><div class="field"><label>From Date</label><input id="fromDate" placeholder="1-7"></div><div class="field"><label>To Date</label><input id="toDate" placeholder="31-7"></div></div>
<div class="actions"><button class="btn dark" id="viewBtn">View Report</button><button class="btn green" id="printBtn">Print / PDF</button><button class="btn light" id="exportBtn">Export Excel</button><button class="btn light" id="clearBtn">Clear</button></div>
</div></section>
<section class="report-paper" id="reportPaper"><div class="zero-note">Select a date and click <b>View Report</b>.</div></section>
</main>
<script>
const ENTRY_KEY='erpDailyConsumption',MASTER_KEY='erpMaterialGroupRateMasterV1';
const $=id=>document.getElementById(id),n=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:0},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=2)=>n(v).toLocaleString('en-PK',{minimumFractionDigits:d,maximumFractionDigits:d}),money=v=>'Rs. '+num(v,2);
function load(k){try{const x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function parseDate(v){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})[-\/.](\d{1,2})(?:[-\/.](\d{2,4}))?$/);if(!m)return'';let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const d=+m[1],mo=+m[2],x=new Date(y,mo-1,d);if(x.getFullYear()!=y||x.getMonth()!=mo-1||x.getDate()!=d)return'';return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function displayDate(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return `${String(d).padStart(2,'0')}-${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]}-${String(y).slice(-2)}`}
function bindDate(el){el.addEventListener('blur',()=>{const d=parseDate(el.value);if(d){el.dataset.iso=d;el.value=displayDate(d)}})}
let mode='daily',lastReport=null;
document.querySelectorAll('.cost-tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.cost-tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.filter-mode').forEach(x=>x.classList.toggle('active',x.dataset.panel===mode))});
['dailyDate','fromDate','toDate'].forEach(id=>bindDate($(id)));
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];$('month').innerHTML=months.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');const cy=new Date().getFullYear();$('year').innerHTML=Array.from({length:8},(_,i)=>cy-4+i).map(y=>`<option>${y}</option>`).join('');$('month').value=new Date().getMonth()+1;$('year').value=cy;const today=new Date().toISOString().slice(0,10);$('dailyDate').dataset.iso=today;$('dailyDate').value=displayDate(today);
function period(){if(mode==='daily'){const d=$('dailyDate').dataset.iso||parseDate($('dailyDate').value);return d?{from:d,to:d,label:displayDate(d)}:null}if(mode==='monthly'){const y=+$('year').value,m=+$('month').value,from=`${y}-${String(m).padStart(2,'0')}-01`,to=new Date(y,m,0).toISOString().slice(0,10);return{from,to,label:`${months[m-1]} ${y}`}}const from=$('fromDate').dataset.iso||parseDate($('fromDate').value),to=$('toDate').dataset.iso||parseDate($('toDate').value);return from&&to&&from<=to?{from,to,label:`${displayDate(from)} to ${displayDate(to)}`}:null}
function getRate(master,date){const source=master.rateSource||'Manual';if(source==='Manual')return{rate:n(master.rate),source:'Manual'};if(source==='Formula')return{rate:n(master.rate),source:'Formula'};const target=String(master.material||'').toLowerCase(),keys=['purchases_local','purchases_zafar','purchases_board','purchases','purchaseEntries','localPurchases','zafarPurchases','boardPurchases'],lines=[];keys.forEach(k=>{load(k).forEach(p=>(Array.isArray(p.items)?p.items:Array.isArray(p.lines)?p.lines:[p]).forEach(x=>lines.push({...p,...x}))) });const found=lines.map(r=>({date:parseDate(r.date||r.purchaseDate||r.purchase_date||String(r.created_at||'').slice(0,10)),name:String(r.materialName||r.itemName||r.item_name||r.material||r.description||r.name||'').toLowerCase(),rate:n(r.costingRate||r.costing_rate||r.unitRate||r.unit_rate||r.rate||r.purchaseRate)})).filter(x=>x.date&&x.date<=date&&x.name===target&&x.rate>0).sort((a,b)=>b.date.localeCompare(a.date))[0];return found?{rate:found.rate,source:'Purchase Auto'}:{rate:n(master.rate),source:'Purchase Auto'} }
function build(){const p=period();if(!p)return alert('Please enter a valid date or period.');const entries=load(ENTRY_KEY).filter(e=>e.date>=p.from&&e.date<=p.to);if(!entries.length){$('reportPaper').innerHTML='<div class="zero-note">No saved Consumption Entry data found for this period.</div>';return}const masters=load(MASTER_KEY).slice().sort((a,b)=>n(a.sequence)-n(b.sequence)||String(a.material).localeCompare(String(b.material)));const materialMap=new Map();let production={pm1:0,pm2:0,pm3:0},electricity={pm1:0,pm2:0,pm3:0},ashWeighted=0,ashDays=0,steam={total:0,machine:0,pulp:0,boiler:0};entries.forEach(e=>{const m=e.metrics||{};production.pm1+=n(m.productionPM1);production.pm2+=n(m.productionPM2);production.pm3+=n(m.productionPM3);electricity.pm1+=n(m.electricityPM1);electricity.pm2+=n(m.electricityPM2);electricity.pm3+=n(m.electricityPM3);if(n(m.averageAsh)||n(e.averageAsh)){ashWeighted+=n(m.averageAsh||e.averageAsh);ashDays++}steam.total+=n(m.steamTotal||e.totalSteam||e.steamProduced);steam.machine+=n(m.steamMachine);steam.pulp+=n(m.steamPulp);steam.boiler+=n(m.steamBoiler);(e.materials||[]).forEach(r=>{const key=String(r.material||'').toLowerCase();const z=materialMap.get(key)||{material:r.material,group:r.group,unit:r.unit,sequence:r.sequence,consumed:0,byDate:{}};z.consumed+=n(r.consumed);z.byDate[e.date]=(z.byDate[e.date]||0)+n(r.consumed);materialMap.set(key,z)})});
const totalProduction=production.pm1+production.pm2+production.pm3,totalElec=electricity.pm1+electricity.pm2+electricity.pm3,avgAsh=ashDays?ashWeighted/ashDays:0;let rows=[];masters.forEach(master=>{const data=materialMap.get(String(master.material||'').toLowerCase())||{consumed:0,byDate:{}};if(data.consumed<=0)return;let qty=0,value=0,lastSource=master.rateSource||'Manual';Object.entries(data.byDate).forEach(([d,q])=>{const rr=getRate(master,d);qty+=q;value+=q*rr.rate;lastSource=rr.source});const rate=qty?value/qty:getRate(master,p.to).rate;rows.push({group:master.group||data.group||'Other',material:master.material||data.material,unit:master.unit||data.unit,sequence:n(master.sequence||data.sequence),consumed:data.consumed,rate,amount:value,costTon:totalProduction?value/totalProduction:0,source:lastSource,yieldStandard:n(master.yieldStandard),steamYield:n(master.steamYield)})});rows.sort((a,b)=>a.sequence-b.sequence||a.material.localeCompare(b.material));
const boilerRows=rows.filter(r=>/boiler|steam/i.test(r.group)),pulpRows=rows.filter(r=>/pulp/i.test(r.group));const boilerCost=boilerRows.reduce((s,r)=>s+r.amount,0),totalAmount=rows.reduce((s,r)=>s+r.amount,0);const expectedSteam=boilerRows.reduce((s,r)=>s+r.consumed*r.steamYield,0);const actualSteamYield=boilerRows.reduce((s,r)=>s+r.consumed,0)?steam.total/boilerRows.reduce((s,r)=>s+r.consumed,0):0;const pulpInput=pulpRows.reduce((s,r)=>s+r.consumed,0);const weightedPulpStd=pulpInput?pulpRows.reduce((s,r)=>s+r.consumed*r.yieldStandard,0)/pulpInput:0;const pulpProduced=pulpInput&&weightedPulpStd?pulpInput*weightedPulpStd/100:0;const electricityRateRow=rows.find(r=>/^electricity$/i.test(r.material));const electricityRate=electricityRateRow?electricityRateRow.rate:0;
lastReport={p,rows,production,electricity,steam,totalProduction,totalAmount};render({p,rows,production,electricity,steam,totalProduction,totalElec,avgAsh,boilerCost,expectedSteam,actualSteamYield,pulpInput,pulpProduced,weightedPulpStd,electricityRate,totalAmount});}
function sr(label,val,std='',unit=''){return `<div class="summary-row"><span class="label">${esc(label)}</span><span class="num">${esc(val)} ${esc(unit)}</span><span class="num">${std!==''?esc(std):'—'}</span></div>`}
function render(x){const groups=[...new Set(x.rows.map(r=>r.group))];let body='',srno=1;groups.forEach(g=>{const gr=x.rows.filter(r=>r.group===g);body+=`<tr class="group-row"><td colspan="9">${esc(g)}</td></tr>`;gr.forEach(r=>body+=`<tr><td class="num">${srno++}</td><td><b>${esc(r.material)}</b></td><td>${esc(r.unit)}</td><td class="num">${num(r.consumed,3)}</td><td class="num">${num(r.rate,2)}</td><td class="num">${num(r.amount,2)}</td><td class="num">${num(r.costTon,2)}</td><td><span class="source ${r.source==='Manual'?'manual':r.source==='Formula'?'formula':''}">${esc(r.source)}</span></td><td class="remarks"></td></tr>`);const a=gr.reduce((s,r)=>s+r.amount,0);body+=`<tr class="group-total"><td colspan="5">${esc(g)} Total</td><td class="num">${num(a,2)}</td><td class="num">${num(x.totalProduction?a/x.totalProduction:0,2)}</td><td colspan="2"></td></tr>`});body+=`<tr class="grand-total"><td colspan="5">TOTAL AMOUNT</td><td class="num">${num(x.totalAmount,2)}</td><td class="num">${num(x.totalProduction?x.totalAmount/x.totalProduction:0,2)}</td><td colspan="2">COST / TON</td></tr>`;
$('reportPaper').innerHTML=`<header class="report-head"><div><h2>Daily Cost Section</h2><p>Production cost calculated from Consumption Entry and Material Group & Rate Master</p></div><div class="report-date">Report Period<br>${esc(x.p.label)}</div></header><div class="summary-grid"><section class="summary-box"><div class="summary-title">Production</div><div class="summary-row summary-head"><span>Particular</span><span>Actual</span><span>Standard</span></div>${sr('Paper Production',num(x.totalProduction,2),'','Ton')}${sr('Paper Ash Avg %',num(x.avgAsh,2),'','%')}${sr('Pulp Produced',num(x.pulpProduced,2),'','Ton')}${sr('Pulp Yield',num(x.pulpInput?x.pulpProduced/x.pulpInput*100:0,2),num(x.weightedPulpStd,2),'%')}</section><section class="summary-box"><div class="summary-title">Boiler House</div><div class="summary-row summary-head"><span>Particular</span><span>Actual</span><span>Standard</span></div>${sr('Steam Production',num(x.steam.total,2),num(x.expectedSteam,2),'Ton')}${sr('Steam Total Cost',money(x.boilerCost),'')}${sr('Steam / Ton Paper',num(x.totalProduction?x.steam.total/x.totalProduction:0,3),'','Ton')}${sr('Actual Steam Yield',num(x.actualSteamYield,3),'','')}</section><section class="summary-box"><div class="summary-title">Electricity</div><div class="summary-row summary-head"><span>Particular</span><span>Actual</span><span>Standard</span></div>${sr('Total Units Consumed',num(x.totalElec,0),'','Unit')}${sr('Rate',money(x.electricityRate),'')}${sr('Unit / Ton Paper',num(x.totalProduction?x.totalElec/x.totalProduction:0,2),'','Unit')}${sr('Cost / Ton Paper',money(x.totalProduction?x.totalElec*x.electricityRate/x.totalProduction:0),'')}</section></div><div class="report-tools"><div class="kpis"><div class="kpi">Materials Used<b>${x.rows.length}</b></div><div class="kpi">Total Production<b>${num(x.totalProduction,2)} Ton</b></div><div class="kpi">Total Cost<b>${money(x.totalAmount)}</b></div><div class="kpi">Cost / Ton<b>${money(x.totalProduction?x.totalAmount/x.totalProduction:0)}</b></div></div><label><input type="checkbox" id="showZero"> Show all master materials</label></div><table class="cost-table"><thead><tr><th>SR #</th><th>Material</th><th>Unit</th><th>Consumed</th><th>Rate</th><th>Amount</th><th>Cost / Ton</th><th>Rate Source</th><th>Remarks</th></tr></thead><tbody>${body}</tbody></table><div class="footer-summary"><div class="mini-box"><h3>Production by Machine</h3><div class="mini-line"><span>Production PM-1</span><span>${num(x.production.pm1,2)} Ton</span></div><div class="mini-line"><span>Production PM-2</span><span>${num(x.production.pm2,2)} Ton</span></div><div class="mini-line"><span>Production PM-3</span><span>${num(x.production.pm3,2)} Ton</span></div><div class="mini-line"><span>Total</span><span>${num(x.totalProduction,2)} Ton</span></div></div><div class="mini-box"><h3>Electricity by Machine</h3><div class="mini-line"><span>Electricity PM-1</span><span>${num(x.electricity.pm1,0)} Unit</span></div><div class="mini-line"><span>Electricity PM-2</span><span>${num(x.electricity.pm2,0)} Unit</span></div><div class="mini-line"><span>Electricity PM-3</span><span>${num(x.electricity.pm3,0)} Unit</span></div><div class="mini-line"><span>Total</span><span>${num(x.totalElec,0)} Unit</span></div></div></div><div class="print-footer">This is computer generated report.</div>`;}
$('viewBtn').onclick=build;$('printBtn').onclick=()=>{if(!lastReport)build();setTimeout(()=>window.print(),50)};$('clearBtn').onclick=()=>{$('reportPaper').innerHTML='<div class="zero-note">Select a date and click <b>View Report</b>.</div>';lastReport=null};$('exportBtn').onclick=()=>{if(!lastReport)return alert('View the report first.');let csv='SR,Group,Material,Unit,Consumed,Rate,Amount,Cost Per Ton,Rate Source\n';lastReport.rows.forEach((r,i)=>csv+=`${i+1},"${r.group}","${r.material}",${r.unit},${r.consumed},${r.rate},${r.amount},${r.costTon},${r.source}\n`);const blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cost-report-'+lastReport.p.from+'-'+lastReport.p.to+'.csv';a.click();URL.revokeObjectURL(a.href)};
</script><script src="public/control-center-runtime-v4.js?v=4.0"></script>
