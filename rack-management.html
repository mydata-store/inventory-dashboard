<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rack Management</title>
<link rel="stylesheet" href="public/common.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="public/common-tools.js"></script><script src="public/theme-settings.js"></script><script src="public/common-theme-manager.js"></script>
<script src="public/common-shell-engine.js"></script><script src="public/pdf-settings.js"></script><script src="public/common-pdf.js"></script><script src="public/common-search.js"></script><script src="public/common-table.js"></script><script src="public/common-form.js"></script><script src="public/rack-engine.js"></script>
<style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:var(--accent);color:#111827}.panel{display:none}.panel.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:#fff;padding:14px;border-radius:14px;border-left:4px solid var(--accent)}.stat small{color:var(--muted);font-size:9px}.stat strong{display:block;font-size:20px;margin-top:4px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}</style><script src="public/page-renderer.js"></script>
<script src="public/design-studio-bootstrap.js"></script>
<script src="public/common-font-controller.js"></script>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="public/core/styles/erp-runtime.css">
<script src="public/core/erp-runtime.js"></script>
<script src="public/core/erp-registry.js"></script><script src="public/core/erp-plugin-manager.js"></script><script src="public/core/erp-framework-status.js"></script>
<script src="public/core/erp-diagnostics.js"></script>
<script src="public/core/erp-settings.js"></script>
<script src="public/core/erp-offline.js"></script>
<script src="public/core/erp-backup.js"></script>
<script src="public/core/erp-host.js"></script>
<script src="public/core/erp-theme-runtime.js"></script>
<script src="public/core/erp-profile-runtime.js"></script>
<script src="public/core/erp-shell-runtime.js"></script>
</head>
<body data-erp-page="rack-management"><div id="appSidebar"></div><main class="app-main">
<div class="page-head"><div><h1>Rack Management</h1><div class="page-subtitle">Rack setup, item allocation, transfers and item location search</div></div><button class="btn btn-primary" onclick="loadAll()">Refresh</button></div>
<div class="tabs"><button class="btn btn-light active" data-tab="setup" onclick="showTab('setup')">Rack Setup</button><button class="btn btn-light" data-tab="allocation" onclick="showTab('allocation')">Item Allocation</button><button class="btn btn-light" data-tab="transfer" onclick="showTab('transfer')">Rack Transfer</button><button class="btn btn-light" data-tab="search" onclick="showTab('search')">Item Location Search</button></div>
<section class="stats"><div class="stat"><small>Total Racks</small><strong id="sRacks">0</strong></div><div class="stat"><small>Allocated Items</small><strong id="sItems">0</strong></div><div class="stat"><small>Assigned Qty</small><strong id="sQty">0</strong></div><div class="stat"><small>Transfers</small><strong id="sTransfers">0</strong></div></section>
<section id="setup" class="panel active"><div class="card"><a class="btn btn-primary" href="master-center.html?type=location">Open Rack Setup Master</a></div><div class="card"><div id="rackTable"></div></div></section>
<section id="allocation" class="panel"><div class="card"><div id="allocationForm"></div></div><div class="card"><div id="allocationTable"></div></div></section>
<section id="transfer" class="panel"><div class="card"><div id="transferForm"></div></div><div class="card"><div id="transferTable"></div></div></section>
<section id="search" class="panel"><div class="card"><div class="form-grid"><div class="form-field span-2"><label>Item</label><input id="itemSearch" placeholder="Type item name or size"></div><div class="form-field span-2"><label>Rack</label><input id="rackSearch" placeholder="Type rack location"></div></div></div><div class="card"><div id="searchTable"></div></div></section>
</main><section id="printReport"></section>
<script>
const db=supabase.createClient("https://lzsxtvkluqvcaetnnydu.supabase.co","sb_publishable_QfemUy-S0bO7fy6-uL_jBA_ZzGXKgma"),engine=new RackEngine({db});let editId=null;
document.addEventListener("DOMContentLoaded",()=>{itemSearch.oninput=renderSearch;rackSearch.oninput=renderSearch;loadAll()});
function showTab(x){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===x));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===x))}
async function loadAll(){try{await engine.load();sRacks.textContent=engine.locations.length;sItems.textContent=new Set(engine.allocations.map(x=>x.item_id)).size;sQty.textContent=engine.allocations.reduce((s,x)=>s+Number(x.assigned_qty||0),0);sTransfers.textContent=engine.transfers.length;buildAllocation();buildTransfer();renderTables();setupSearch()}catch(e){AppTools.toast(e.message,"error")}}
function renderTables(){new AppTable({container:"#rackTable",rows:engine.locations,rowId:"id",searchable:true,searchDropdown:true,sortable:true,resizable:true,selectable:true,stickyFirstColumn:true,preferencesKey:"racks",pdfTitle:"RACK MASTER REPORT",columns:[{key:"location_code",label:"Code"},{key:"location_name",label:"Location"},{key:"store_name",label:"Store"},{key:"zone",label:"Zone"},{key:"rack_no",label:"Rack"},{key:"shelf_no",label:"Shelf"},{key:"bin_no",label:"Bin"},{key:"capacity",label:"Capacity",type:"number"},{key:"status",label:"Status",type:"status"}],onDetail:detailRack,onRowOpen:detailRack});
new AppTable({container:"#allocationTable",rows:engine.allocations,rowId:"id",searchable:true,searchDropdown:true,sortable:true,resizable:true,selectable:true,stickyFirstColumn:true,preferencesKey:"rack_alloc",pdfTitle:"RACK ITEM ALLOCATION REPORT",columns:[{key:"location_name",label:"Rack"},{key:"item_code",label:"Item Code"},{key:"item_name",label:"Item"},{key:"size",label:"Size"},{key:"assigned_qty",label:"Qty",type:"number"},{key:"unit",label:"Unit"},{key:"minimum_qty",label:"Min Qty",type:"number"},{key:"maximum_qty",label:"Max Qty",type:"number"},{key:"primary_location",label:"Primary"}],onDetail:detail,onEdit:editAlloc,onDelete:delAlloc,onRowOpen:detail});
new AppTable({container:"#transferTable",rows:engine.transfers,rowId:"id",searchable:true,searchDropdown:true,sortable:true,resizable:true,selectable:true,preferencesKey:"rack_transfers",pdfTitle:"RACK TRANSFER REPORT",columns:[{key:"transfer_date",label:"Date",type:"date"},{key:"from_location_name",label:"From Rack"},{key:"to_location_name",label:"To Rack"},{key:"item_name",label:"Item"},{key:"size",label:"Size"},{key:"qty",label:"Qty",type:"number"},{key:"unit",label:"Unit"},{key:"transferred_by",label:"Transferred By"}],onDetail:detail});renderSearch()}
function detail(r){AppTools.openModal("Detail",`<div class="detail-grid">${Object.entries(r).filter(([k])=>!["id","created_at"].includes(k)).map(([k,v])=>`<div class="detail-box"><span>${k.replaceAll("_"," ")}</span><strong>${AppTools.escapeHtml(v??"-")}</strong></div>`).join("")}</div>`)}
function detailRack(r){const items=engine.locationItems(r.id);AppTools.openModal(r.location_name+" Detail",`<div class="detail-grid"><div class="detail-box"><span>Code</span><strong>${r.location_code}</strong></div><div class="detail-box"><span>Items</span><strong>${items.length}</strong></div><div class="detail-box"><span>Assigned Qty</span><strong>${engine.usage(r.id)}</strong></div><div class="detail-box"><span>Capacity</span><strong>${r.capacity||"-"} ${r.capacity_unit||""}</strong></div></div><h3>Items in Rack</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Item</th><th>Size</th><th>Qty</th><th>Unit</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.item_name}</td><td>${x.size||""}</td><td>${x.assigned_qty}</td><td>${x.unit||""}</td></tr>`).join("")||'<tr><td colspan="4" class="table-empty">No items assigned.</td></tr>'}</tbody></table></div>`)}
function buildAllocation(){allocationForm.innerHTML="";const f=new AppForm({container:"#allocationForm",title:editId?"Edit Allocation":"Allocate Item to Rack",draftKey:"rack_alloc",buttons:["new","save","clear","print"],fields:[{name:"location_id",label:"Rack / Location",required:true},{name:"item_id",label:"Item",required:true},{name:"item_code",label:"Item Code",readonly:true},{name:"size",label:"Size",readonly:true},{name:"unit",label:"Unit",readonly:true},{name:"assigned_qty",label:"Assigned Qty",required:true,numeric:true,number:true,min:.001},{name:"minimum_qty",label:"Minimum Qty",numeric:true,number:true,min:0},{name:"maximum_qty",label:"Maximum Qty",numeric:true,number:true,min:0},{name:"primary_location",label:"Primary Location",type:"select",options:["No","Yes"],defaultValue:"No"},{name:"remarks",label:"Remarks",type:"textarea",span:4}],async onSave(v){const l=engine.getLocation(v.location_id),i=engine.getItem(v.item_id);if(!l||!i){AppTools.toast("Select valid rack and item.","error");return false}await engine.saveAllocation({location_id:+v.location_id,location_code:l.location_code,location_name:l.location_name,item_id:+v.item_id,item_code:i.item_code||"",item_name:i.item_name||"",size:i.size||"",unit:i.unit||"",assigned_qty:+v.assigned_qty,minimum_qty:+(v.minimum_qty||0),maximum_qty:v.maximum_qty===""?null:+v.maximum_qty,primary_location:v.primary_location,remarks:v.remarks||""},editId);editId=null;await loadAll();return true},onPrint(){AppPDF.printStandardReport({title:"RACK ITEM ALLOCATION REPORT",columns:[{key:"location_name",label:"Rack"},{key:"item_code",label:"Item Code"},{key:"item_name",label:"Item"},{key:"size",label:"Size"},{key:"assigned_qty",label:"Qty"},{key:"unit",label:"Unit"}],rows:engine.allocations})}});AppSearch.setupTypeahead(f.getField("location_id"),{values:engine.locations,getLabel:r=>r.location_name,minChars:0,onSelect:r=>f.setFieldValue("location_id",r.id)});AppSearch.setupTypeahead(f.getField("item_id"),{values:engine.items,getLabel:i=>engine.labelItem(i),minChars:0,onSelect:i=>{f.setFieldValue("item_id",i.id);f.setFieldValue("item_code",i.item_code||"");f.setFieldValue("size",i.size||"");f.setFieldValue("unit",i.unit||"")}});window.allocForm=f}
function editAlloc(r){editId=r.id;buildAllocation();allocForm.setValues({location_id:r.location_id,item_id:r.item_id,item_code:r.item_code,size:r.size,unit:r.unit,assigned_qty:r.assigned_qty,minimum_qty:r.minimum_qty,maximum_qty:r.maximum_qty,primary_location:r.primary_location,remarks:r.remarks},true);showTab("allocation");scrollTo({top:0,behavior:"smooth"})}
async function delAlloc(r){if(!confirm("Delete this allocation?"))return;try{await engine.deleteAllocation(r.id);await loadAll();AppTools.toast("Allocation deleted.","success")}catch(e){AppTools.toast(e.message,"error")}}
function buildTransfer(){transferForm.innerHTML="";const f=new AppForm({container:"#transferForm",title:"Transfer Item Between Racks",draftKey:"rack_transfer",buttons:["new","save","clear","print"],fields:[{name:"transfer_date",label:"Date",required:true,date:true,placeholder:"25-6"},{name:"from_location_id",label:"From Rack",required:true},{name:"to_location_id",label:"To Rack",required:true},{name:"item_id",label:"Item",required:true},{name:"available_qty",label:"Available Qty",readonly:true},{name:"qty",label:"Transfer Qty",required:true,numeric:true,number:true,min:.001},{name:"transferred_by",label:"Transferred By",capitalize:true},{name:"remarks",label:"Remarks",type:"textarea",span:4}],async onSave(v){await engine.transfer(v);await loadAll();return true},onPrint(){AppPDF.printStandardReport({title:"RACK TRANSFER REPORT",columns:[{key:"transfer_date",label:"Date"},{key:"from_location_name",label:"From"},{key:"to_location_name",label:"To"},{key:"item_name",label:"Item"},{key:"size",label:"Size"},{key:"qty",label:"Qty"},{key:"unit",label:"Unit"}],rows:engine.transfers})}});AppSearch.setupTypeahead(f.getField("from_location_id"),{values:engine.locations,getLabel:r=>r.location_name,minChars:0,onSelect:r=>{f.setFieldValue("from_location_id",r.id);setupTransferItems(f)}});AppSearch.setupTypeahead(f.getField("to_location_id"),{values:engine.locations,getLabel:r=>r.location_name,minChars:0,onSelect:r=>f.setFieldValue("to_location_id",r.id)});setupTransferItems(f)}
function setupTransferItems(f){const rows=engine.allocations.filter(x=>+x.location_id===+f.getFieldValue("from_location_id"));AppSearch.setupTypeahead(f.getField("item_id"),{values:rows,getLabel:r=>[r.item_name,r.size].filter(Boolean).join(" - "),minChars:0,onSelect:r=>{f.setFieldValue("item_id",r.item_id);f.setFieldValue("available_qty",r.assigned_qty)}})}
function setupSearch(){AppSearch.setupTypeahead(itemSearch,{values:engine.items,getLabel:i=>engine.labelItem(i),minChars:0,onSelect:i=>{itemSearch.value=engine.labelItem(i);renderSearch()}});AppSearch.setupTypeahead(rackSearch,{values:engine.locations,getLabel:r=>r.location_name,minChars:0,onSelect:r=>{rackSearch.value=r.location_name;renderSearch()}})}
function renderSearch(){const iq=itemSearch.value.toLowerCase(),rq=rackSearch.value.toLowerCase(),rows=engine.allocations.filter(x=>(!iq||[x.item_code,x.item_name,x.size].join(" ").toLowerCase().includes(iq))&&(!rq||[x.location_code,x.location_name].join(" ").toLowerCase().includes(rq)));new AppTable({container:"#searchTable",rows,rowId:"id",searchable:false,sortable:true,resizable:true,selectable:true,stickyFirstColumn:true,preferencesKey:"rack_search",pdfTitle:"ITEM LOCATION REPORT",columns:[{key:"item_code",label:"Item Code"},{key:"item_name",label:"Item"},{key:"size",label:"Size"},{key:"location_name",label:"Rack / Location"},{key:"assigned_qty",label:"Qty",type:"number"},{key:"unit",label:"Unit"},{key:"primary_location",label:"Primary"}],onDetail:detail,onRowOpen:detail})}
</script></body></html>
