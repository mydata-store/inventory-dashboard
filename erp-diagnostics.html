<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP Diagnostics</title><link rel="stylesheet" href="public/common.css"><link rel="stylesheet" href="public/core/styles/erp-runtime.css"><script src="public/common-theme-manager.js"></script><script src="public/common-shell-settings.js"></script><script src="public/common-shell-engine.js"></script><script src="public/core/erp-runtime.js"></script><script src="public/core/erp-registry.js"></script><script src="public/core/erp-plugin-manager.js"></script><script src="public/core/erp-framework-status.js"></script><script src="public/core/erp-diagnostics.js"></script><script src="public/core/erp-settings.js"></script><script src="public/core/erp-offline.js"></script><script src="public/core/erp-backup.js"></script><script src="public/core/erp-host.js"></script><script src="public/core/erp-theme-runtime.js"></script><script src="public/core/erp-profile-runtime.js"></script><script src="public/core/erp-shell-runtime.js"></script><style>.page{max-width:1180px;margin:24px auto;padding:20px}.hero{background:#10233f;color:#fff;padding:22px;border-radius:16px}.line{padding:12px;border-bottom:1px solid #e2e8f0}.ok{color:#15803d;font-weight:800}.bad{color:#b91c1c;font-weight:800}.log{background:#0f172a;color:#dbeafe;border-radius:10px;padding:12px;min-height:150px;white-space:pre-wrap;font:12px Consolas}</style></head><body data-erp-page="erp-diagnostics"><div id="appSidebar"></div><main class="page app-main"><div class="hero"><h1>ERP Diagnostics Center</h1><p>Check shared files, browser capabilities, host configuration, local data and backup readiness.</p></div><div class="erp-grid" style="margin-top:16px"><div class="erp-runtime-card"><h2>Live Tests</h2><div id="tests"></div><button class="erp-btn" onclick="run()">Run Diagnostics</button></div><div class="erp-runtime-card"><h2>Runtime Log</h2><div id="logs" class="log">No logs.</div></div></div></main><script>async function run(){const s=await ERPFrameworkStatus.snapshot();const checks=[['ERP Core loaded',!!ERP],['Registry loaded',!!ERPRegistry],['Plugin manager loaded',!!ERPPlugins],['IndexedDB supported',s.storage],['Service Worker supported',s.serviceWorker],['Internet available',s.online],['Host configured',!!s.host.name],['Backup folder selected',s.backupFolder!=='Not connected'],['Profile runtime loaded',!!ERP.state.profile],['Theme runtime loaded',!!ERP.state.theme]];tests.innerHTML=checks.map(([n,o])=>`<div class="line"><span class="${o?'ok':'bad'}">${o?'✔':'✖'}</span> ${n}</div>`).join('');logs.textContent=ERP.Diagnostics.all().map(x=>`${x.time} [${x.level}] ${x.area}: ${x.message}`).join('\n')||'No runtime errors logged.'}ERP.on('ready',run)</script></body></html>
