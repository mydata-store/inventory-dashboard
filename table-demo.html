<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Common Table Demo</title>
<link rel="stylesheet" href="public/common.css">
<script src="public/common-tools.js"></script>
<script src="public/theme-settings.js"></script>
<script src="public/common-layout.js"></script>
<script src="public/pdf-settings.js"></script>
<script src="public/common-pdf.js"></script>
<script src="public/common-search.js"></script>
<script src="public/common-table.js"></script>
</head>
<body>
<div id="appSidebar"></div>
<main class="app-main">
  <div class="page-head"><div><h1>Common Table Engine</h1><div class="page-subtitle">Sorting, selection, resizing, column control, keyboard navigation, Excel and PDF</div></div></div>
  <section class="card">
    <div id="demoTable"></div>
  </section>
</main>
<section id="printReport"></section>
<script>
const demoRows=[
{id:1,code:"ITM-0001",item:"MS Nut Bolt 1/2x3",category:"Raw Materials",qty:20,unit:"Kg",value:6600,status:"Active"},
{id:2,code:"ITM-0002",item:"MS Welding Rod 7018",category:"Welding",qty:50,unit:"Kg",value:22500,status:"Active"},
{id:3,code:"ITM-0003",item:"Bearing 6205",category:"Bearings",qty:12,unit:"Nos",value:18000,status:"Inactive"}
];

const table=new AppTable({
 container:"#demoTable",
 columns:[
  {key:"code",label:"Item Code"},
  {key:"item",label:"Item Name"},
  {key:"category",label:"Category"},
  {key:"qty",label:"Qty",type:"number"},
  {key:"unit",label:"Unit"},
  {key:"value",label:"Value",type:"currency"},
  {key:"status",label:"Status",type:"status"}
 ],
 rows:demoRows,
 rowId:"id",
 searchable:true,
 sortable:true,
 resizable:true,
 selectable:true,
 stickyFirstColumn:true,
 showTotals:true,
 totals:{qty:"sum",value:"sum"},
 preferencesKey:"table_demo",
 pdfTitle:"ITEM STOCK REPORT",
 pdfSubtitle:"Common Table Engine Demo",
 onDetail:row=>AppTools.openModal("Item Detail",`<div class="detail-grid">${Object.entries(row).map(([k,v])=>`<div class="detail-box"><span>${k}</span><strong>${v}</strong></div>`).join("")}</div>`),
 onEdit:row=>AppTools.toast("Edit "+row.item,"info"),
 onDelete:row=>AppTools.toast("Delete "+row.item,"error"),
 onRowOpen:row=>AppTools.toast("Opened "+row.item,"success")
});

window.APP_COMMANDS=[
 {title:"Dashboard",subtitle:"Open dashboard",href:"index.html"},
 {title:"Table Demo",subtitle:"Open common table engine",href:"table-demo.html"},
 {title:"Theme Settings",subtitle:"Change theme and sidebar",href:"theme-settings.html"},
 {title:"PDF Settings",subtitle:"Change PDF and logo",href:"pdf-settings.html"}
];
</script>
</body>
</html>
