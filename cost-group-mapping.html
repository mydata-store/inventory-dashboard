<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cost Group Mapping Master</title><link rel="stylesheet" href="public/common.css">
<script src="public/common-tools.js"></script>
<script src="public/theme-settings.js"></script>
<script src="public/common-theme-manager.js"></script>
<script src="public/common-shell-engine.js"></script>
<script src="public/page-renderer.js"></script>
<script src="public/design-studio-bootstrap.js"></script>
<script src="public/common-font-controller.js"></script>
<link rel="stylesheet" href="public/core/styles/erp-runtime.css">
<link rel="stylesheet" href="public/core/styles/erp-platform-runtime.css">
<script src="public/core/erp-runtime.js"></script>
<script src="public/core/erp-registry.js"></script>
<script src="public/core/erp-module-registry.js"></script>
<script src="public/core/erp-platform-runtime.js" defer></script><link rel="stylesheet" href="costing-v2.css"><script src="costing-v2-store.js"></script></head><body data-erp-page="cost-group-mapping"><div id="appSidebar"></div><main class="app-main app-page">
<div class="page-head"><div><h1>Cost Group Mapping Master</h1><p>Materials selected here become available automatically in entry and report pages.</p></div><div class="actions"><a class="btn" href="costing.html">Dashboard</a><button class="btn primary" id="saveMapping">Save Mapping</button></div></div>
<section class="panel"><div class="toolbar"><div class="field"><label>Search Material</label><input id="mapSearch" class="input" placeholder="Type material name"></div><div class="field"><label>Cost Group</label><select id="groupFilter" class="select"><option value="">All Groups</option></select></div><button class="btn orange" id="addMaterial">Add Material</button></div></section>
<section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Sequence</th><th>Material</th><th>Cost Group</th><th>Unit</th><th>Standard Yield %</th><th>Active</th><th>Current Rate</th><th>Action</th></tr></thead><tbody id="mapBody"></tbody></table></div><div id="mapStatus" class="status">Ready.</div></section>
<div id="materialModal" class="modal-backdrop"><div class="modal"><h3>Add Material</h3><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Material Name</label><input id="newName" class="input"></div><div class="field"><label>Cost Group</label><select id="newGroup" class="select"></select></div><div class="field"><label>Unit</label><input id="newUnit" class="input" value="Kg"></div><div class="field"><label>Standard Yield %</label><input id="newYield" type="number" class="input"></div></div><div class="actions" style="margin-top:16px"><button id="confirmAdd" class="btn primary">Add</button><button id="closeAdd" class="btn">Cancel</button></div></div></div>
<script>
const groups=['Pulp','Ash (Filler)','Steam','Electricity','Coating','Binder','Color','Recycle','Chemicals','Production Information'];let data=CostingV2.materials();
function opts(sel){sel.innerHTML=groups.map(g=>`<option>${g}</option>`).join('')} opts(newGroup);groupFilter.innerHTML+=[...new Set(data.map(x=>x.group))].map(g=>`<option>${g}</option>`).join('');
function render(){const q=mapSearch.value.toLowerCase(),gf=groupFilter.value;mapBody.innerHTML=data.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!gf||x.group===gf)).map(x=>{const rr=CostingV2.effectiveRate(x.id,new Date().toISOString().slice(0,10));return `<tr data-id="${x.id}"><td><input class="seq" type="number" value="${x.sequence||''}"></td><td><input class="name" value="${x.name}" ${x.system?'readonly':''}></td><td><select class="group">${groups.map(g=>`<option ${g===x.group?'selected':''}>${g}</option>`).join('')}</select></td><td><input class="unit" value="${x.unit||''}"></td><td><input class="yield" type="number" step="0.01" value="${x.standardYield??''}"></td><td class="center"><input class="active" type="checkbox" ${x.active!==false?'checked':''}></td><td>${rr?'Rs '+rr.rate.toLocaleString():'—'}</td><td><a class="btn small" href="material-rate-master.html?material=${x.id}">Rates</a></td></tr>`}).join('')}
function collect(){document.querySelectorAll('#mapBody tr').forEach(tr=>{const x=data.find(z=>z.id===tr.dataset.id);if(!x)return;x.sequence=+tr.querySelector('.seq').value||9999;x.name=tr.querySelector('.name').value.trim();x.group=tr.querySelector('.group').value;x.unit=tr.querySelector('.unit').value.trim();x.standardYield=tr.querySelector('.yield').value===''?'':+tr.querySelector('.yield').value;x.active=tr.querySelector('.active').checked})}
mapSearch.oninput=render;groupFilter.onchange=render;saveMapping.onclick=()=>{collect();CostingV2.saveMaterials(data);mapStatus.textContent='Mapping saved successfully.';render()};addMaterial.onclick=()=>materialModal.classList.add('show');closeAdd.onclick=()=>materialModal.classList.remove('show');confirmAdd.onclick=()=>{const name=newName.value.trim();if(!name)return;data.push({id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),name,group:newGroup.value,unit:newUnit.value||'Kg',standardYield:newYield.value===''?'':+newYield.value,sequence:9999,active:true});materialModal.classList.remove('show');newName.value='';render()};render();
</script></main></body></html>
