<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Health Control Tower</title>
<link rel="stylesheet" href="public/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="public/common-tools.js"></script>
<script src="public/theme-settings.js"></script>
<script src="public/common-layout.js"></script>
<script src="public/pdf-settings.js"></script>
<script src="public/common-pdf.js"></script>
<script src="public/common-search.js"></script>
<script src="public/common-table.js"></script>
<script src="public/erp-health.js"></script>
<script src="public/erp-health-v2.js"></script>
<style>
.top-grid{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-bottom:16px}.score-card{background:#fff;border-radius:14px;padding:20px;text-align:center;box-shadow:0 8px 22px #0001}
.score-ring{width:145px;height:145px;border-radius:50%;margin:auto;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--score)*1%),#e5e7eb 0)}.score-ring:before{content:"";width:112px;height:112px;border-radius:50%;background:#fff;position:absolute}.score-ring strong,.score-ring span{position:relative}.score-ring strong{font-size:31px}.score-ring span{font-size:11px;color:var(--muted)}
.priority-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.priority-card{padding:15px;border-radius:12px;background:#fff;box-shadow:0 8px 22px #0001;border-left:4px solid}.priority-card.critical{border-color:#991b1b}.priority-card.high{border-color:#dc2626}.priority-card.medium{border-color:#f59e0b}.priority-card.low{border-color:#16a34a}.priority-card small{font-size:9px;color:var(--muted)}.priority-card strong{display:block;font-size:22px;margin-top:4px}
.main-grid{display:grid;grid-template-columns:1fr 360px;gap:16px}.check-list{display:grid;gap:9px}.check-row{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:11px;background:#fff}.check-row.ignored{opacity:.55}.check-row h3{font-size:12px;margin:0}.check-row p{font-size:9px;color:var(--muted);margin:3px 0 0}.icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900}.critical .icon,.high .icon{background:#fee2e2;color:#991b1b}.medium .icon{background:#fef3c7;color:#92400e}.low .icon,.none .icon{background:#dcfce7;color:#166534}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button,.row-actions a{font-size:9px;padding:6px 8px}
.task{display:flex;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}.task strong{font-size:10px}.task span{font-size:9px;color:var(--muted)}.chart-wrap{height:230px}.repair-entry{padding:9px;border-bottom:1px solid var(--border);font-size:9px}.loading{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:1000px){.main-grid,.top-grid{grid-template-columns:1fr}.priority-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.priority-grid{grid-template-columns:1fr}.check-row{grid-template-columns:36px 1fr}.row-actions{grid-column:2}}
</style>
</head>
<body>
<div id="appSidebar"></div>
<main class="app-main">
<div class="page-head"><div><h1>ERP Health Control Tower</h1><div class="page-subtitle">Daily checklist, priorities, timeline, safe repairs and ERP recommendations</div></div><button class="btn btn-primary" onclick="runHealth()">Run Health Check</button></div>
<section id="loadingBox" class="card loading">Preparing ERP control tower...</section>
<div id="content" style="display:none">
<section class="top-grid"><div class="score-card"><div class="score-ring" id="scoreRing" style="--score:0"><div><strong id="overallScore">0%</strong><br><span>Overall Health</span></div></div><div style="margin-top:10px;font-size:10px">Estimated work: <strong id="estimatedTime">0 min</strong></div></div>
<div class="priority-grid"><div class="priority-card critical"><small>Critical</small><strong id="criticalCount">0</strong></div><div class="priority-card high"><small>High Priority</small><strong id="highCount">0</strong></div><div class="priority-card medium"><small>Medium Priority</small><strong id="mediumCount">0</strong></div><div class="priority-card low"><small>Low Priority</small><strong id="lowCount">0</strong></div></div></section>
<section class="main-grid"><div>
<div class="card"><div class="search-row" style="margin-bottom:12px"><input id="searchBox" placeholder="Search issues..."><select id="priorityFilter"><option value="">All Priorities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option><option>None</option></select><select id="statusFilter"><option value="">All Status</option><option value="error">Error</option><option value="warning">Warning</option><option value="ok">Passed</option></select><button class="btn btn-danger" onclick="printHealth()">Print / PDF</button></div><div id="checkList" class="check-list"></div></div>
<div class="card"><h2>Health Timeline</h2><div class="chart-wrap"><canvas id="healthChart"></canvas></div></div>
</div><aside><div class="card"><h2>Today's Checklist</h2><div id="dailyChecklist"></div></div><div class="card"><h2>ERP Advisor</h2><div id="advisor"></div></div><div class="card"><h2>Repair Log</h2><div id="repairLog"></div></div></aside></section>
</div></main><section id="printReport"></section>
<script>
const db=supabase.createClient("https://lzsxtvkluqvcaetnnydu.supabase.co","sb_publishable_QfemUy-S0bO7fy6-uL_jBA_ZzGXKgma"),health=new ERPHealthV2({db});let results=[],summary={},chart=null;
document.addEventListener("DOMContentLoaded",()=>{searchBox.oninput=renderChecks;priorityFilter.onchange=renderChecks;statusFilter.onchange=renderChecks;runHealth()});
async function runHealth(){loadingBox.style.display="block";content.style.display="none";try{const out=await health.runV2();results=out.results;summary=out.summary;renderSummary();renderChecks();renderChecklist();renderAdvisor();renderTimeline();await renderRepairLog();loadingBox.style.display="none";content.style.display="block";AppTools.toast("ERP Health Control Tower updated.","success")}catch(e){loadingBox.innerHTML="Health check failed: "+AppTools.escapeHtml(e.message);AppTools.toast(e.message,"error")}}
function renderSummary(){overallScore.textContent=summary.overall_score+"%";scoreRing.style.setProperty("--score",summary.overall_score);criticalCount.textContent=summary.priority.Critical;highCount.textContent=summary.priority.High;mediumCount.textContent=summary.priority.Medium;lowCount.textContent=summary.priority.Low;estimatedTime.textContent=summary.estimated_minutes+" min"}
function filtered(){const q=searchBox.value.toLowerCase().trim();return results.filter(r=>(!q||`${r.title} ${r.group} ${r.recommendation}`.toLowerCase().includes(q))&&(!priorityFilter.value||r.priority===priorityFilter.value)&&(!statusFilter.value||r.status===statusFilter.value))}
function renderChecks(){checkList.innerHTML=filtered().map(r=>`<div class="check-row ${r.priority.toLowerCase()} ${r.ignored?"ignored":""}"><div class="icon">${r.status==="ok"?"✓":r.priority==="Critical"?"×":"!"}</div><div><h3>${AppTools.escapeHtml(r.title)} <small>(${r.priority})</small></h3><p>${AppTools.escapeHtml(r.recommendation)} • ${r.count} record(s) • ${r.estimated_minutes} min</p></div><div class="row-actions"><button class="btn btn-light" onclick="viewCheck('${r.id}')">View</button>${r.target_url?`<a class="btn btn-primary" href="${r.target_url}">Open</a>`:""}${r.status!=="ok"?`<button class="btn btn-success" onclick="repair('${r.id}')">Repair</button>`:""}<button class="btn btn-warning" onclick="toggleIgnore('${r.id}',${r.ignored})">${r.ignored?"Unignore":"Ignore"}</button></div></div>`).join("")||'<div class="table-empty">No matching checks.</div>'}
function viewCheck(id){const r=results.find(x=>x.id===id);if(!r)return;const cols=r.records.length?Object.keys(r.records[0]).filter(k=>k!=="created_at").slice(0,8):[];const table=r.records.length?`<div class="table-wrap"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${c.replaceAll("_"," ")}</th>`).join("")}</tr></thead><tbody>${r.records.map(row=>`<tr>${cols.map(c=>`<td>${AppTools.escapeHtml(typeof row[c]==="object"?JSON.stringify(row[c]):row[c]??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:'<p>No problems found.</p>';AppTools.openModal(r.title,`<div class="detail-grid"><div class="detail-box"><span>Priority</span><strong>${r.priority}</strong></div><div class="detail-box"><span>Status</span><strong>${r.status}</strong></div><div class="detail-box"><span>Count</span><strong>${r.count}</strong></div><div class="detail-box"><span>Score</span><strong>${r.score}%</strong></div></div><p><strong>Recommendation:</strong> ${AppTools.escapeHtml(r.recommendation)}</p>${table}`)}
async function toggleIgnore(id,ignored){try{ignored?await health.unignoreCheck(id):await health.ignoreCheck(id);await runHealth()}catch(e){AppTools.toast(e.message,"error")}}
async function repair(id){try{const r=await health.autoRepair(id);AppTools.toast(r.message,r.changed?"success":"info");await runHealth()}catch(e){AppTools.toast(e.message,"error")}}
function renderChecklist(){const tasks=health.dailyChecklist(results);dailyChecklist.innerHTML=tasks.map(t=>`<label class="task"><input type="checkbox" onchange="toggleIgnore('${t.id}',false)"><div><strong>${AppTools.escapeHtml(t.title)}</strong><br><span>${t.count} issue(s) • ${t.priority} • ${t.estimated_minutes} min</span></div></label>`).join("")||'<div class="detail-box"><strong>No pending tasks.</strong></div>'}
function renderAdvisor(){const p=results.filter(r=>r.status!=="ok"&&!r.ignored).sort((a,b)=>a.score-b.score).slice(0,7);advisor.innerHTML=p.map(r=>`<div class="advisor-item"><strong>${AppTools.escapeHtml(r.title)}:</strong><br>${AppTools.escapeHtml(r.recommendation)}</div>`).join("")||'<div class="detail-box"><strong>ERP data is healthy.</strong></div>'}
function renderTimeline(){const points=[...health.snapshots,{overall_score:summary.overall_score,created_at:new Date().toISOString()}].slice(-30);if(chart)chart.destroy();chart=new Chart(healthChart,{type:"line",data:{labels:points.map(x=>new Date(x.created_at).toLocaleDateString("en-PK",{day:"2-digit",month:"short"})),datasets:[{label:"ERP Health %",data:points.map(x=>Number(x.overall_score||0)),tension:.25,fill:false}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100}}}})}
async function renderRepairLog(){const {data,error}=await db.from("erp_health_repairs").select("*").order("repaired_at",{ascending:false}).limit(20);repairLog.innerHTML=error?'<div class="table-empty">Repair log unavailable.</div>':(data||[]).map(r=>`<div class="repair-entry"><strong>${AppTools.escapeHtml(r.action)}</strong><br>${r.affected_records} record(s) • ${new Date(r.repaired_at).toLocaleString()}</div>`).join("")||'<div class="table-empty">No repairs recorded.</div>'}
function printHealth(){AppPDF.printStandardReport({title:"ERP HEALTH CONTROL TOWER REPORT",subtitle:`Overall Health: ${summary.overall_score}%`,columns:[{key:"priority",label:"Priority"},{key:"group",label:"Group"},{key:"title",label:"Check"},{key:"status",label:"Status"},{key:"count",label:"Count"},{key:"score",label:"Score"},{key:"recommendation",label:"Recommendation"}],rows:filtered()})}
</script></body></html>
