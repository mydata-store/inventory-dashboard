<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP Framework Status</title><link rel="stylesheet" href="public/common.css"><link rel="stylesheet" href="public/core/styles/erp-runtime.css"><script src="public/common-theme-manager.js"></script><script src="public/common-shell-settings.js"></script><script src="public/common-shell-engine.js"></script><script src="public/core/erp-runtime.js"></script><script src="public/core/erp-registry.js"></script><script src="public/core/erp-plugin-manager.js"></script><script src="public/core/erp-framework-status.js"></script><script src="public/core/erp-diagnostics.js"></script><script src="public/core/erp-settings.js"></script><script src="public/core/erp-offline.js"></script><script src="public/core/erp-backup.js"></script><script src="public/core/erp-host.js"></script><script src="public/core/erp-theme-runtime.js"></script><script src="public/core/erp-profile-runtime.js"></script><script src="public/core/erp-shell-runtime.js"></script><style>.page{max-width:1180px;margin:24px auto;padding:20px}.hero{background:#10233f;color:#fff;padding:22px;border-radius:16px}.item{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px;border-bottom:1px solid #e2e8f0}.ok{color:#15803d;font-weight:800}.pending{color:#b45309;font-weight:800}</style></head><body data-erp-page="framework-status"><div id="appSidebar"></div><main class="page app-main"><div class="hero"><h1>ERP Framework Status</h1><p>Live view of the universal core and module integration progress.</p></div><div class="erp-runtime-card" style="margin-top:16px" id="summary"></div><div class="erp-grid" style="margin-top:16px"><div class="erp-runtime-card"><h2>Core Services</h2><div id="core"></div></div><div class="erp-runtime-card"><h2>ERP Page Integration</h2><div id="pages"></div></div></div></main><script>async function render(){const s=await ERPFrameworkStatus.snapshot();summary.innerHTML=`<h2>Framework ${s.version}</h2><p>${s.online?'Online':'Offline'} · Host: ${s.host.name||'Not configured'} · Pending records: ${s.pending} · Backup: ${s.backupFolder}</p>`;const checks=[['Universal ERP Core',true],['Universal Shell',true],['Theme Engine',true],['Profile Engine',true],['Autofill Engine',true],['Offline Engine',s.storage],['Excel Backup',!!ERPBackup],['Host Manager',true],['Service Worker',s.serviceWorker]];core.innerHTML=checks.map(([n,o])=>`<div class="item"><span>${n}</span><span class="${o?'ok':'pending'}">${o?'✔ Running':'⏳ Attention'}</span></div>`).join('');const plans=[['Dashboard','index.html'],['Masters','masters.html'],['Purchase','local-purchase.html'],['Issue','issue.html'],['Gate Pass','gate-pass.html'],['Reports','reports.html']];pages.innerHTML=plans.map(([n,p])=>{const found=s.registeredPages.some(x=>x===p||x.includes(p.replace('.html','')));return `<div class="item"><span>${n}</span><span class="${found?'ok':'pending'}">${found?'✔ Connected':'⏳ Pending'}</span></div>`}).join('')}ERP.on('ready',render)</script></body></html>
