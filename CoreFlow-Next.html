.theme-field{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.theme-field label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}.theme-field input[type=color]{width:42px;height:28px;border:0;background:none;padding:0}
.theme-live{border:1px solid var(--line);border-radius:12px;background:#eef3f8;padding:12px}.theme-live-shell{height:260px;display:grid;grid-template-columns:28% 1fr;border-radius:10px;overflow:hidden;background:#fff}.theme-live-side{padding:12px}.theme-live-side i{display:block;height:8px;background:#ffffffa8;border-radius:4px;margin:10px 0}.theme-live-main{padding:11px}.theme-live-top,.theme-live-banner,.theme-live-box{border-radius:7px}.theme-live-top{height:25px;margin-bottom:9px}.theme-live-banner{height:65px;margin-bottom:9px}.theme-live-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.theme-live-box{height:48px}

.sb-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:16px}.sb-gallery{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-top:14px}.sb-style{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;cursor:pointer}.sb-style.selected{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 12%,transparent)}.sb-mini{height:100px;border-radius:8px;padding:9px;color:#fff;overflow:hidden}.sb-mini b{font-size:10px}.sb-mini i{display:block;height:6px;background:#ffffff9c;border-radius:5px;margin:9px 0;width:75%}.sb-style small{display:block;margin-top:7px;color:var(--muted)}.sb-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sb-field{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.sb-field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}.sb-field input[type=range],.sb-field select{width:100%}.sb-field input[type=color]{width:100%;height:34px;border:0;background:none}.sb-check{display:flex;align-items:center;justify-content:space-between;gap:10px}.sb-preview-wrap{background:#eef3f8;border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:12px}.sb-preview{height:390px;display:grid;grid-template-columns:var(--sb-preview-w,190px) 1fr;border-radius:11px;overflow:hidden;background:#fff;box-shadow:0 8px 22px #17203318;transition:grid-template-columns var(--sb-speed,.25s) ease}.sb-preview.collapsed{grid-template-columns:var(--sb-preview-cw,62px) 1fr}.sb-preview-side{padding:15px 10px;color:var(--sb-text,#dbe8ff);background:var(--sb-bg,#10284b);transition:all var(--sb-speed,.25s) ease}.sb-preview-logo{font-weight:800;margin-bottom:18px}.sb-preview.collapsed .sb-preview-logo{font-size:0}.sb-preview.collapsed .sb-preview-logo:after{content:'CF';font-size:15px}.sb-preview-menu{padding:8px;border-radius:8px;margin:5px 0;white-space:nowrap;overflow:hidden}.sb-preview-menu.on{background:var(--sb-active,#315985);color:var(--sb-active-text,#fff)}.sb-preview.collapsed .sb-preview-menu span{display:none}.sb-preview-main{background:var(--bg);padding:14px}.sb-preview-main i{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;height:48px;margin-bottom:9px}.sb-message{font-size:12px;color:var(--muted);margin-top:10px}.sb-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:1100px){.sb-gallery{grid-template-columns:repeat(3,1fr)}.sb-layout{grid-template-columns:1fr}}@media(max-width:650px){.sb-gallery,.sb-controls{grid-template-columns:1fr 1fr}}

/* v1.2.1 — Sidebar runtime position + Analytics Blue Sidebar Studio polish */

 margin-left:var(--cf-sb-workspace-offset,220px)!important;
 transition:margin-left var(--cf-sb-speed,250ms) var(--cf-sb-ease,ease)!important;
}

<script>
(function(){
 const KEY='coreflow.clean.v1';
 const SNAPSHOT_KEY='coreflow.clean.boot.snapshot.v1';
 const PAGES=['erpDashboard','home','gallery','theme','sidebar','icons','wallpaper','clock','user','company','banner','dashboard','login','settings'];
 const DEFAULT={version:1,route:{page:'home'},design:{base:'analytics',overrides:{theme:null}},targets:{},updatedAt:null};
 const clone=o=>JSON.parse(JSON.stringify(o));
 function normalize(raw){
   let s=clone(DEFAULT);
   if(!raw||typeof raw!=='object')return s;
   if(raw.route&&PAGES.includes(raw.route.page))s.route.page=raw.route.page;
   if(raw.design&&['analytics','studioBlue'].includes(raw.design.base))s.design.base=raw.design.base;
   if(raw.design&&raw.design.overrides&&typeof raw.design.overrides==='object')s.design.overrides=raw.design.overrides;
   if(raw.design&&raw.design.customThemes&&typeof raw.design.customThemes==='object')s.design.customThemes=raw.design.customThemes;
   if(raw.targets&&typeof raw.targets==='object')s.targets=raw.targets;
   s.updatedAt=raw.updatedAt||null;return s;
 }
 function readBootSnapshot(){try{const x=localStorage.getItem(SNAPSHOT_KEY);return x?normalize(JSON.parse(x)):null}catch(e){return null}}
 function writeBootSnapshot(s){try{localStorage.setItem(SNAPSHOT_KEY,JSON.stringify(normalize(s)))}catch(e){}}
 const LocalStateDB={
   DB_NAME:'CoreFlowCleanDB',DB_VERSION:1,STORE:'app_state',KEY:'coreflow_state',db:null,
   async open(){
     if(this.db)return this.db;
     this.db=await new Promise((resolve,reject)=>{
       const r=indexedDB.open(this.DB_NAME,this.DB_VERSION);
       r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(this.STORE))r.result.createObjectStore(this.STORE)};
       r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Database open failed'));
     }); return this.db;
   },
   async read(){
     const db=await this.open();
     return new Promise((resolve,reject)=>{
       const r=db.transaction(this.STORE,'readonly').objectStore(this.STORE).get(this.KEY);
       r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error||new Error('Database read failed'));
     });
   },
   async write(state){
     const db=await this.open(),data=normalize(state);data.updatedAt=new Date().toISOString();
     await new Promise((resolve,reject)=>{
       const tx=db.transaction(this.STORE,'readwrite');tx.objectStore(this.STORE).put(data,this.KEY);
       tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Database write failed'));tx.onabort=()=>reject(tx.error||new Error('Database write aborted'));
     });
     const verify=await this.read();if(!verify)throw new Error('Database verification failed');
     return normalize(verify);
   }
 };
 window.CoreFlow={
   KEY,SNAPSHOT_KEY,PAGES,DEFAULT,clone,normalize,LocalStateDB,readBootSnapshot,writeBootSnapshot,state:readBootSnapshot()||clone(DEFAULT),dbStatus:'starting',dbError:'',
   normalize,clone,DEFAULT,
   async save(){
     try{this.state=await this.LocalStateDB.write(this.state);writeBootSnapshot(this.state);this.dbStatus='ready';this.dbError='';return true}
     catch(e){this.dbStatus='error';this.dbError=e?.message||String(e);return false}
   },
   navigate(page,options={}){
     if(!PAGES.includes(page))page='home';
     const current=this.state.route.page;
     document.documentElement.dataset.cfRoute=page;
     this.state.route.page=page;
     if(!options.fromHistory && page!==current){
       try{
         const u=new URL(location.href);u.searchParams.set('cfPage',page);u.searchParams.set('cfDesign',this.state.design.base);
         history.pushState({coreflow:true,page:page,design:this.state.design.base},'',u.pathname+u.search+u.hash);
       }catch(e){}
     }
     this.renderRoute();
   },
   async setBase(base){if(!['analytics','studioBlue'].includes(base))return;this.state.design.base=base;if(this.state.targets?.designGallery)this.state.targets.designGallery.activeCustomId=null;
     if(await this.save()){try{const u=new URL(location.href);u.searchParams.set('cfDesign',base);history.replaceState({coreflow:true,page:this.state.route.page},'',u.pathname+u.search+u.hash)}catch(e){}this.applyDesign();if(typeof cfThemeApplied==='function'){const th=cfThemeApplied();cfThemeDraft=th?this.clone(th):null;cfThemeSelected=th?.id||null;if(typeof cfThemeUI==='function')cfThemeUI()}updateGalleryUI();updateDiagnostics()}
   },
   applyDesign(){

     r.setProperty('--nav',blue?'#12325c':'#ffffff');
     r.setProperty('--nav2',blue?'#174a82':'#ffffff');
     r.setProperty('--primary',blue?'#1677ff':'#0d67b5');
     r.setProperty('--bg',blue?'#f4f7fb':'#eef5fb');
     r.setProperty('--card','#ffffff');
     r.setProperty('--text',blue?'#172033':'#16324f');
     r.setProperty('--muted',blue?'#6b7890':'#6f859b');
     r.setProperty('--line',blue?'#dce4ef':'#d8e5ef');
     document.body.dataset.design=this.state.design.base;
     const savedTheme=typeof cfThemeApplied==='function'?cfThemeApplied():null;
     if(typeof cfApplyThemeToSystem==='function')cfApplyThemeToSystem(savedTheme);
     if(typeof cfSyncAnalyticsTopBar==='function')requestAnimationFrame(cfSyncAnalyticsTopBar);
     if(typeof cfSyncModuleBack==='function')requestAnimationFrame(cfSyncModuleBack);
   },
   renderRoute(){
     const page=PAGES.includes(this.state.route.page)?this.state.route.page:'home';
     document.documentElement.dataset.cfRoute=page;
     if(typeof cfSyncModuleBack==='function')requestAnimationFrame(cfSyncModuleBack);
     if(typeof cfSyncAnalyticsTopBar==='function')requestAnimationFrame(cfSyncAnalyticsTopBar);
     document.querySelectorAll('.page').forEach(el=>el.classList.toggle('on',el.id===page));
     document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('on',el.dataset.page===page));
     document.querySelectorAll('aside .nav').forEach(el=>{
       const active=el.dataset.page===page;el.classList.toggle('on',active);
       el.style.removeProperty('background');el.style.removeProperty('color');el.style.removeProperty('box-shadow');
     });
     const el=document.getElementById(page);document.getElementById('title').textContent=el?.dataset.title||'CoreFlow';
     /* v2.6.1 router-owned lazy UI initialization for late studios */
     if(page==='company'&&typeof cfCpUI==='function')cfCpUI();
     else if(page==='banner'&&typeof cfBnUI==='function')cfBnUI();
     else if(page==='dashboard'&&typeof cfDsUI==='function')cfDsUI();
     else if(page==='login'&&typeof cfLgUI==='function')cfLgUI();
     if(page==='home'||page==='settings')updateDiagnostics();
   }
 };
 /* v2.2.3 Full Hydration: CoreFlow.state already comes from the synchronous
    boot snapshot. Keep a normalized copy before any Studio draft is created. */
 CoreFlow.state=normalize(CoreFlow.state);
})();

(function cfHydrateFirstFrame(){
 try{

  if(typeof cfApplySidebar==='function'){const x=typeof cfSidebarSaved==='function'?cfSidebarSaved():null;if(x)cfApplySidebar(x)}

const CF_SRP_PRESETS={
 desktop:[[2560,1440],[1920,1080],[1680,1050],[1600,900],[1440,900]],
 laptop:[[1920,1080],[1536,864],[1440,900],[1366,768],[1280,800]],
 tablet:[[1024,1366],[834,1194],[820,1180],[768,1024]],

let cfSrpMode='auto',cfSrpTimer=0;
function cfSrpViewport(){const v=window.visualViewport;return{w:Math.round(v?.width||innerWidth||1366),h:Math.round(v?.height||innerHeight||768)}}
function cfSrpClassify(w){return w<=600?'mobile':w<=1100?'tablet':w<=1600?'laptop':'desktop'}
function cfSrpFill(mode,w,h){
 const s=document.getElementById('cfSrpResolution');if(!s)return;
 if(mode==='auto'){s.innerHTML=`<option value="${w}x${h}">Detected ${w} × ${h}</option>`;s.disabled=true;return}
 s.disabled=false;s.innerHTML=CF_SRP_PRESETS[mode].map(([x,y])=>`<option value="${x}x${y}">${x} × ${y}</option>`).join('');
}
function cfSrpFit(){
 const vp=cfSrpViewport(),mode=cfSrpMode==='auto'?cfSrpClassify(vp.w):cfSrpMode,sel=document.getElementById('cfSrpResolution');
 let w=vp.w,h=vp.h;if(cfSrpMode!=='auto'&&sel?.value)[w,h]=sel.value.split('x').map(Number);
 const stage=document.getElementById('cfSrpStage'),scaleBox=document.getElementById('cfSrpScale'),frame=document.getElementById('cfSrpFrame');if(!stage||!scaleBox||!frame)return;
 frame.style.width=w+'px';frame.style.height=h+'px';
 const sc=Math.min(1,Math.max(.1,(stage.clientWidth-24)/(w+12)),Math.max(.1,(stage.clientHeight-24)/(h+12)));
 scaleBox.style.width=(w+12)+'px';scaleBox.style.height=((h+12)*sc)+'px';scaleBox.style.transform=`scale(${sc})`;
 document.querySelectorAll('[data-srp-device]').forEach(b=>b.classList.toggle('on',b.dataset.srpDevice===cfSrpMode));
 const d=document.getElementById('cfSrpDetected');if(d)d.textContent=`Detected ${vp.w} × ${vp.h} · ${cfSrpClassify(vp.w).toUpperCase()} · Fit ${Math.round(sc*100)}%`;
}
function cfSrpSet(mode){cfSrpMode=['auto','desktop','laptop','tablet','mobile'].includes(mode)?mode:'auto';const v=cfSrpViewport();cfSrpFill(cfSrpMode,v.w,v.h);requestAnimationFrame(cfSrpFit)}

   CoreFlow.dbStatus='error';CoreFlow.dbError=err?.message||String(err);console.error(err);
   document.documentElement.dataset.cfNavReady='1';document.body.classList.add('ready');updateDiagnostics();
   const bm=document.getElementById('bootmsg');if(bm){bm.style.display='block';bm.classList.add('error');bm.textContent='Local Database error: '+CoreFlow.dbError}
 }
})();
</script>
