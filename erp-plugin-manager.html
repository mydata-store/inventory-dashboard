<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP Plugin Manager</title><link rel="stylesheet" href="public/common.css"><link rel="stylesheet" href="public/core/styles/erp-runtime.css"><link rel="manifest" href="manifest.json">
<script src="public/common-theme-manager.js"></script><script src="public/common-shell-settings.js"></script><script src="public/common-shell-engine.js"></script>
<script src="public/core/erp-runtime.js"></script><script src="public/core/erp-registry.js"></script><script src="public/core/erp-plugin-manager.js"></script><script src="public/core/erp-framework-status.js"></script><script src="public/core/erp-diagnostics.js"></script><script src="public/core/erp-settings.js"></script><script src="public/core/erp-offline.js"></script><script src="public/core/erp-backup.js"></script><script src="public/core/erp-host.js"></script><script src="public/core/erp-theme-runtime.js"></script><script src="public/core/erp-profile-runtime.js"></script><script src="public/core/erp-shell-runtime.js"></script><style>.page{max-width:1180px;margin:24px auto;padding:20px}.hero{background:#10233f!important;color:#fff!important;padding:24px;border-radius:16px}.hero *{color:#fff!important}.hero h1{margin:0 0 8px!important}.muted{color:#64748b}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#e2e8f0}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.metric{font-size:26px;font-weight:900}.empty{padding:24px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}.table th{font-size:12px;text-transform:uppercase;color:#64748b}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.status-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:6px}.plugin{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px;border-bottom:1px solid #e2e8f0}.category{margin-top:16px}.category h2{margin:0;padding:14px;background:#f8fafc;border-radius:10px}.search{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}</style><link rel="stylesheet" href="public/core/styles/erp-platform-runtime.css">
<script src="public/core/erp-module-registry.js"></script>
<script src="public/core/erp-platform-runtime.js" defer></script>
<script src="public/core/erp-business-alerts.js" defer></script>
<script src="public/core/erp-live-status.js" defer></script>
<script src="public/core/erp-design-studio-runtime.js" defer></script>
</head><body data-erp-page="plugin-manager"><div id="appSidebar"></div><main class="page app-main"><div class="hero"><h1>ERP Plugin & Feature Manager</h1><p>Core features are protected. Future modules can be registered and enabled without rebuilding the ERP Core.</p></div><div class="erp-runtime-card" style="margin-top:16px"><input id="q" class="search" placeholder="Search plugins and features..." oninput="render()"><div id="summary" class="actions"></div></div><div id="list"></div></main><script>function render(){const term=q.value.trim().toLowerCase(),all=Object.values(ERPPlugins.all()).filter(x=>!term||`${x.name} ${x.category} ${x.description||''}`.toLowerCase().includes(term)),cats=['Core','Business','Communication','Intelligence','Enterprise','Future'];summary.innerHTML=`<span class="pill ok">${all.filter(x=>x.enabled).length} Enabled</span><span class="pill">${all.length} Available</span>`;list.innerHTML=cats.map(cat=>{const rows=all.filter(x=>(x.category||'Future')===cat);if(!rows.length)return'';return `<section class="erp-runtime-card category"><h2>${cat}</h2>${rows.map(x=>`<div class="plugin"><div><b>${x.name}</b><div class="muted">Version ${x.version} · ${x.status}${x.description?' · '+x.description:''}</div></div><div><span class="pill ${x.enabled?'ok':''}">${x.enabled?'Enabled':'Disabled'}</span> <button class="erp-btn secondary" ${x.core?'disabled':''} onclick="togglePlugin('${x.id}',${!x.enabled})">${x.enabled?'Disable':'Enable'}</button></div></div>`).join('')}</section>`}).join('')}function togglePlugin(id,v){try{ERPPlugins.setEnabled(id,v);render()}catch(e){alert(e.message)}}ERP.on('ready',render)</script></body></html>
