<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP Plugin Manager</title><link rel="stylesheet" href="public/common.css"><link rel="stylesheet" href="public/core/styles/erp-runtime.css"><script src="public/common-theme-manager.js"></script><script src="public/common-shell-settings.js"></script><script src="public/common-shell-engine.js"></script><script src="public/core/erp-runtime.js"></script><script src="public/core/erp-registry.js"></script><script src="public/core/erp-plugin-manager.js"></script><script src="public/core/erp-framework-status.js"></script><script src="public/core/erp-settings.js"></script><script src="public/core/erp-theme-runtime.js"></script><script src="public/core/erp-profile-runtime.js"></script><script src="public/core/erp-shell-runtime.js"></script><style>.page{max-width:1180px;margin:24px auto;padding:20px}.hero{background:#10233f;color:#fff;padding:22px;border-radius:16px}.plugin{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px;border-bottom:1px solid #e2e8f0}.badge{padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px;font-weight:800}.on{background:#dcfce7;color:#166534}</style></head><body data-erp-page="plugin-manager"><div id="appSidebar"></div><main class="page app-main"><div class="hero"><h1>ERP Plugin & Feature Manager</h1><p>Core features are protected. Future modules can be registered and enabled without rebuilding the ERP Core.</p></div><div class="erp-runtime-card" style="margin-top:16px" id="list"></div></main><script>function render(){const p=Object.values(ERPPlugins.all());list.innerHTML=p.map(x=>`<div class="plugin"><div><b>${x.name}</b><div style="color:#64748b;font-size:13px">Version ${x.version} · ${x.status}</div></div><div><span class="badge ${x.enabled?'on':''}">${x.enabled?'Enabled':'Disabled'}</span> <button class="erp-btn secondary" ${x.core?'disabled':''} onclick="togglePlugin('${x.id}',${!x.enabled})">${x.enabled?'Disable':'Enable'}</button></div></div>`).join('')}function togglePlugin(id,v){try{ERPPlugins.setEnabled(id,v);render()}catch(e){alert(e.message)}}ERP.on('ready',render)</script></body></html>
