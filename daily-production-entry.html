<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Production Entry Center</title><link rel="stylesheet" href="public/common.css">
<script src="public/common-tools.js"></script>
<script src="public/theme-settings.js"></script>
<script src="public/common-theme-manager.js"></script>
<script src="public/common-shell-engine.js"></script>
<script src="public/page-renderer.js"></script>
<script src="public/design-studio-bootstrap.js"></script>
<script src="public/common-font-controller.js"></script>
<link rel="stylesheet" href="public/core/styles/erp-runtime.css">
<link rel="stylesheet" href="public/core/styles/erp-platform-runtime.css">
<script src="public/core/erp-runtime.js"></script>
<script src="public/core/erp-registry.js"></script>
<script src="public/core/erp-module-registry.js"></script>
<script src="public/core/erp-platform-runtime.js" defer></script><link rel="stylesheet" href="costing-v2.css"><script src="costing-v2-store.js"></script></head><body data-erp-page="daily-production-entry"><div id="appSidebar"></div><main class="app-main app-page">
<div class="page-head"><div><h1>Daily Production Entry Center</h1><p>Enter all common-unit and paper-machine data for one production date.</p></div><div class="actions"><a class="btn" href="costing.html">Dashboard</a><button id="loadDay" class="btn">Load Date</button><button id="saveDay" class="btn primary">Save Daily Data</button></div></div>
<section class="panel"><div class="toolbar"><div class="field"><label>Production Date</label><input id="entryDate" class="input" type="date"></div><div class="field" style="min-width:260px"><label>General Remarks</label><input id="generalRemarks" class="input"></div></div></section>
<div class="tabs"><button class="tab active" data-tab="pulp">Pulp Unit</button><button class="tab" data-tab="boiler">Common Boiler</button><button class="tab" data-tab="pm1">PM-1</button><button class="tab" data-tab="pm2">PM-2</button><button class="tab" data-tab="pm3">PM-3</button></div>
<section id="pulp" class="tab-pane active panel"><div class="toolbar"><div class="field"><label>Pulp Produced (Ton)</label><input id="pulpProduced" class="input" type="number" step="0.001"></div><div class="field"><label>Steam Used (Ton)</label><input id="pulpSteam" class="input" type="number" step="0.001"></div><div class="field"><label>Electricity Used (kWh)</label><input id="pulpElectricity" class="input" type="number" step="0.001"></div></div><div id="pulpTable"></div></section>
<section id="boiler" class="tab-pane panel"><div class="toolbar"><div class="field"><label>Total Steam Produced</label><input id="steamProduced" class="input" type="number"></div><div class="field"><label>Steam to Pulp</label><input id="steamToPulp" class="input" type="number"></div><div class="field"><label>Steam to PM-1</label><input id="steamToPM1" class="input" type="number"></div><div class="field"><label>Steam to PM-2</label><input id="steamToPM2" class="input" type="number"></div><div class="field"><label>Steam to PM-3</label><input id="steamToPM3" class="input" type="number"></div><div class="field"><label>Boiler Loss/Self Use</label><input id="steamLoss" class="input" type="number"></div></div><div id="boilerTable"></div></section>
<section id="pm1" class="tab-pane panel"><div id="pm1Fields"></div><div id="pm1Table"></div></section><section id="pm2" class="tab-pane panel"><div id="pm2Fields"></div><div id="pm2Table"></div></section><section id="pm3" class="tab-pane panel"><div id="pm3Fields"></div><div id="pm3Table"></div></section><div id="entryStatus" class="status">Ready. Select a date and enter daily data.</div>
<script>
const mats=CostingV2.materials().filter(x=>!x.system&&x.active!==false);entryDate.value=new Date().toISOString().slice(0,10);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
function materialTable(group,host,prefix){const list=mats.filter(x=>x.group===group);host.innerHTML=`<div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Material</th><th>Unit</th><th>Opening</th><th>Received</th><th>Actual Consumption</th><th>Standard Yield %</th><th>Applied Rate</th><th>Consumption Value</th></tr></thead><tbody>${list.map(x=>`<tr data-id="${x.id}"><td>${x.name}</td><td>${x.unit}</td><td><input class="opening" type="number" step="0.001"></td><td><input class="received" type="number" step="0.001"></td><td><input class="consumed" type="number" step="0.001"></td><td><input class="std" value="${x.standardYield??''}" readonly></td><td class="rate">0.00</td><td class="value">0.00</td></tr>`).join('')}</tbody></table></div>`;host.querySelectorAll('tr[data-id]').forEach(tr=>tr.querySelector('.consumed').oninput=()=>calcRow(tr))}
function calcRow(tr){const id=tr.dataset.id,q=CostingV2.n(tr.querySelector('.consumed').value),r=CostingV2.effectiveRate(id,entryDate.value)?.rate||0;tr.querySelector('.rate').textContent=r.toLocaleString(undefined,{minimumFractionDigits:2});tr.querySelector('.value').textContent=(q*r).toLocaleString(undefined,{minimumFractionDigits:2})}
materialTable('Pulp',pulpTable,'pulp');materialTable('Steam',boilerTable,'boiler');
function pmFields(pm){return `<div class="toolbar"><div class="field"><label>Paper Production (Ton)</label><input class="paperProduction input" type="number"></div><div class="field"><label>Ash Average %</label><input class="ash input" type="number"></div><div class="field"><label>WAPDA (kWh)</label><input class="wapda input" type="number"></div><div class="field"><label>Solar (kWh)</label><input class="solar input" type="number"></div><div class="field"><label>Pulp Consumed (Ton)</label><input class="pulpConsumed input" type="number"></div><div class="field"><label>Steam Consumed (Ton)</label><input class="steamConsumed input" type="number"></div></div>`}
['pm1','pm2','pm3'].forEach(pm=>{document.getElementById(pm+'Fields').innerHTML=pmFields(pm);const groups=['Ash (Filler)','Binder','Color','Coating','Recycle','Chemicals'];const list=mats.filter(x=>groups.includes(x.group));document.getElementById(pm+'Table').innerHTML=`<div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Material</th><th>Group</th><th>Unit</th><th>Opening</th><th>Received</th><th>Consumption</th><th>Applied Rate</th><th>Value</th></tr></thead><tbody>${list.map(x=>`<tr data-id="${x.id}"><td>${x.name}</td><td>${x.group}</td><td>${x.unit}</td><td><input class="opening" type="number"></td><td><input class="received" type="number"></td><td><input class="consumed" type="number"></td><td class="rate">0.00</td><td class="value">0.00</td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll(`#${pm}Table tr[data-id]`).forEach(tr=>tr.querySelector('.consumed').oninput=()=>calcRow(tr))});
function rowData(host,unit){const o={};host.querySelectorAll('tr[data-id]').forEach(tr=>{o[tr.dataset.id]={opening:CostingV2.n(tr.querySelector('.opening').value),received:CostingV2.n(tr.querySelector('.received').value),consumed:CostingV2.n(tr.querySelector('.consumed').value),unit}});return o}
function collect(){const e={date:entryDate.value,remarks:generalRemarks.value,pulp:{produced:CostingV2.n(pulpProduced.value),steam:CostingV2.n(pulpSteam.value),electricity:CostingV2.n(pulpElectricity.value)},boiler:{steamProduced:CostingV2.n(steamProduced.value),toPulp:CostingV2.n(steamToPulp.value),toPM1:CostingV2.n(steamToPM1.value),toPM2:CostingV2.n(steamToPM2.value),toPM3:CostingV2.n(steamToPM3.value),loss:CostingV2.n(steamLoss.value)},machines:{},materials:{}};document.querySelectorAll('#pulpTable tr[data-id]').forEach(tr=>e.materials[tr.dataset.id]={opening:CostingV2.n(tr.querySelector('.opening').value),received:CostingV2.n(tr.querySelector('.received').value),pulp:CostingV2.n(tr.querySelector('.consumed').value)});document.querySelectorAll('#boilerTable tr[data-id]').forEach(tr=>e.materials[tr.dataset.id]={opening:CostingV2.n(tr.querySelector('.opening').value),received:CostingV2.n(tr.querySelector('.received').value),boiler:CostingV2.n(tr.querySelector('.consumed').value)});['pm1','pm2','pm3'].forEach(pm=>{const pane=document.getElementById(pm),f=pane.querySelector('#'+pm+'Fields')||pane;e.machines[pm]={production:CostingV2.n(f.querySelector('.paperProduction').value),ash:CostingV2.n(f.querySelector('.ash').value),wapda:CostingV2.n(f.querySelector('.wapda').value),solar:CostingV2.n(f.querySelector('.solar').value),pulp:CostingV2.n(f.querySelector('.pulpConsumed').value),steam:CostingV2.n(f.querySelector('.steamConsumed').value)};document.querySelectorAll(`#${pm}Table tr[data-id]`).forEach(tr=>{const z=e.materials[tr.dataset.id]||{opening:CostingV2.n(tr.querySelector('.opening').value),received:CostingV2.n(tr.querySelector('.received').value)};z[pm]=CostingV2.n(tr.querySelector('.consumed').value);e.materials[tr.dataset.id]=z})});return e}
function setRows(host,obj,key){host.querySelectorAll('tr[data-id]').forEach(tr=>{const z=obj?.[tr.dataset.id]||{};tr.querySelector('.opening').value=z.opening||'';tr.querySelector('.received').value=z.received||'';tr.querySelector('.consumed').value=z[key]||'';calcRow(tr)})}
function load(){const e=CostingV2.entries().find(x=>x.date===entryDate.value);document.querySelectorAll('input[type=number]').forEach(x=>x.value='');if(!e){entryStatus.textContent='No saved entry for this date. New entry ready.';return}generalRemarks.value=e.remarks||'';pulpProduced.value=e.pulp?.produced||'';pulpSteam.value=e.pulp?.steam||'';pulpElectricity.value=e.pulp?.electricity||'';steamProduced.value=e.boiler?.steamProduced||'';steamToPulp.value=e.boiler?.toPulp||'';steamToPM1.value=e.boiler?.toPM1||'';steamToPM2.value=e.boiler?.toPM2||'';steamToPM3.value=e.boiler?.toPM3||'';steamLoss.value=e.boiler?.loss||'';setRows(pulpTable,e.materials,'pulp');setRows(boilerTable,e.materials,'boiler');['pm1','pm2','pm3'].forEach(pm=>{const f=document.getElementById(pm+'Fields'),m=e.machines?.[pm]||{};f.querySelector('.paperProduction').value=m.production||'';f.querySelector('.ash').value=m.ash||'';f.querySelector('.wapda').value=m.wapda||'';f.querySelector('.solar').value=m.solar||'';f.querySelector('.pulpConsumed').value=m.pulp||'';f.querySelector('.steamConsumed').value=m.steam||'';setRows(document.getElementById(pm+'Table'),e.materials,pm)});entryStatus.textContent='Saved data loaded.'}
saveDay.onclick=()=>{if(!entryDate.value)return alert('Select date.');CostingV2.saveDaily(collect());entryStatus.textContent='Daily production and consumption data saved successfully.'};loadDay.onclick=load;entryDate.onchange=load;
</script></main></body></html>
