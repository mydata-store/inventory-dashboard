<!doctype html><html lang="en"><head><title>Daily Production Entry Center</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="public/common.css"><script src="public/common-tools.js"></script><script src="public/theme-settings.js"></script><script src="public/common-theme-manager.js"></script><script src="public/common-shell-engine.js"></script><script src="public/page-renderer.js"></script><script src="public/design-studio-bootstrap.js"></script><script src="public/common-font-controller.js"></script><link rel="stylesheet" href="public/core/styles/erp-runtime.css"><link rel="stylesheet" href="public/core/styles/erp-platform-runtime.css"><script src="public/core/erp-runtime.js"></script><script src="public/core/erp-registry.js"></script><script src="public/core/erp-module-registry.js"></script><script src="public/core/erp-platform-runtime.js" defer></script><link rel="stylesheet" href="costing-v2.css"><style>
:root{--navy:#101b2d;--navy2:#1b2b45;--orange:#ffad00;--yellow:#ffcc00;--blue:#2563eb;--bg:#eef3f8;--panel:#fff;--border:#d7e1ec;--text:#10213b;--muted:#64748b;--green:#16a34a;--red:#dc2626;--silver:#94a3b8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:var(--text)}body{min-height:100vh}.app-page{min-height:100vh;padding:18px 20px 48px}.app-main{transition:.2s}body.erp-shell-left .app-page,body.erp-shell-hybrid .app-page{margin-left:var(--erp-side-width,170px)!important;width:calc(100% - var(--erp-side-width,170px))!important}body.erp-shell-collapsed .app-page{margin-left:var(--erp-side-collapsed,58px)!important;width:calc(100% - var(--erp-side-collapsed,58px))!important}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}.page-head h1{margin:0;font-size:27px;line-height:1.15}.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid transparent;border-radius:9px;padding:9px 14px;font-weight:750;cursor:pointer;text-decoration:none;background:#fff;color:var(--text);box-shadow:0 3px 11px rgba(15,23,42,.09);font-size:12px}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--blue);color:#fff}.btn.orange{background:var(--orange);color:#111827}.btn.dark{background:var(--navy);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:7px 10px}
.hero,.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 18px rgba(15,23,42,.055)}.hero{padding:20px 22px;border-color:#efc43c;background:linear-gradient(110deg,#fff8d6,#fff)}.hero h2{margin:0 0 5px;font-size:21px}.hero p{margin:0;color:var(--muted)}.panel{padding:14px;margin-top:14px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.panel-title h2,.panel-title h3{margin:0}.muted{color:var(--muted)}
.grid{display:grid;gap:14px}.dashboard-cards{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}.module-card{display:flex;flex-direction:column;min-height:205px;padding:20px;background:#fff;border:1px solid var(--border);border-radius:15px;text-decoration:none;color:inherit;box-shadow:0 7px 20px rgba(15,23,42,.06);transition:.18s}.module-card:hover{transform:translateY(-3px);border-color:var(--orange);box-shadow:0 10px 26px rgba(15,23,42,.1)}.module-card .icon{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:#fff1b3;font-size:24px;margin-bottom:12px}.module-card h3{font-size:18px;margin:0 0 6px}.module-card p{color:var(--muted);line-height:1.45;margin:0;font-size:13px}.module-card .go{margin-top:auto;padding-top:15px;font-weight:800;font-size:13px}.tag{display:inline-block;width:max-content;background:#dcfce7;color:#166534;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;margin-bottom:9px}.tag.blue{background:#dbeafe;color:#1d4ed8}.tag.orange{background:#fff1c2;color:#92400e}
.toolbar{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;min-width:145px}.field.grow{flex:1;min-width:190px}.field label{font-size:10px;font-weight:800;color:#52627a;text-transform:uppercase}.input,.select{width:100%;height:38px;border:1px solid #cbd7e6;border-radius:8px;padding:7px 10px;background:#fff;color:var(--text);font-size:13px}.input:focus,.select:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}.input[readonly]{background:#f7f9fc}.metrics{grid-template-columns:repeat(6,minmax(0,1fr));margin-top:14px}.metric{background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:11px}.metric label{display:block;font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase}.metric strong{font-size:17px;display:block;margin-top:4px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff}.data-table{width:100%;border-collapse:separate;border-spacing:0;min-width:1200px}.data-table th,.data-table td{border-bottom:1px solid #dce4ed;border-right:1px solid #e4eaf1;padding:8px 7px;text-align:left;white-space:nowrap}.data-table th{background:#ffa500;color:#111827;font-size:11px;position:sticky;top:0;z-index:3;text-align:center}.data-table thead tr:nth-child(2) th{top:34px}.data-table td{background:#fff;font-size:12px}.data-table tr:hover td{background:#f8fbff}.data-table tr.group td{background:var(--navy2);color:#fff;font-weight:800;padding:8px}.data-table input,.data-table select{width:100%;border:1px solid #cbd7e6;border-radius:7px;padding:6px;background:#fff;font-size:12px}.center{text-align:center!important}.right{text-align:right!important}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800}.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.silver{background:#e2e8f0;color:#334155}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 13px;font-weight:750;cursor:pointer}.tab.active{background:var(--navy);color:#fff}.tab-pane{display:none}.tab-pane.active{display:block}.note{background:#fff8d9;border-left:4px solid var(--orange);padding:10px 12px;border-radius:8px;margin-top:11px;font-size:12px}.status{margin-top:12px;padding:9px 11px;border-radius:8px;background:#f8fafc;border:1px solid var(--border);font-size:12px}.section-title{background:var(--navy2);color:#fff;padding:8px 10px;border-radius:8px 8px 0 0;font-weight:800}.empty{padding:26px;text-align:center;color:var(--muted)}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:9999;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(660px,100%);background:#fff;border-radius:14px;box-shadow:0 25px 70px rgba(0,0,0,.25);padding:20px}.modal h3{margin-top:0}.hidden{display:none!important}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.dashboard-cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app-page{padding:12px 8px 40px}.dashboard-cards,.metrics{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}body.erp-shell-left .app-page,body.erp-shell-hybrid .app-page,body.erp-shell-collapsed .app-page{margin-left:var(--erp-side-collapsed,58px)!important;width:calc(100% - var(--erp-side-collapsed,58px))!important}}
@media print{#appSidebar,.actions,.toolbar,.no-print{display:none!important}.app-page{margin:0!important;width:100%!important;padding:0!important}.panel,.hero{box-shadow:none}.data-table th{background:#ffcc00!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style><script src="costing-v2-store.js"></script></head><body data-erp-page="daily-production-entry"><div id="appSidebar"></div><main class="app-main app-page"><div class="page-head"><div><h1>Daily Production Entry Center</h1><p>One production date controls Pulp Unit, Common Boiler and all three paper machines.</p></div><div class="actions"><a class="btn" href="costing.html">Dashboard</a><button class="btn primary" id="saveDaily">Save Daily Data</button></div></div>
<section class="panel"><div class="toolbar"><div class="field"><label>Production Date</label><input id="entryDate" class="input" type="date"></div><button class="btn orange" id="loadDaily">Load Existing</button><div class="note" style="margin:0;flex:1">Materials are loaded automatically from Cost Group Mapping Master.</div></div></section>
<div class="tabs" id="tabs"><button class="tab active" data-tab="pulp">Pulp Unit</button><button class="tab" data-tab="boiler">Common Boiler</button><button class="tab" data-tab="pm1">PM-1</button><button class="tab" data-tab="pm2">PM-2</button><button class="tab" data-tab="pm3">PM-3</button></div>
<section id="pulp" class="panel tab-pane active"><div class="panel-title"><h2>Pulp Unit Entry</h2></div><div class="toolbar"><div class="field"><label>Pulp Produced (Ton)</label><input id="pulpProduced" class="input" type="number" step="0.001"></div><div class="field"><label>Steam Used (Ton)</label><input id="pulpSteam" class="input" type="number" step="0.001"></div><div class="field"><label>Electricity Used (kWh)</label><input id="pulpElec" class="input" type="number" step="0.001"></div></div><div id="pulpTable"></div></section>
<section id="boiler" class="panel tab-pane"><div class="panel-title"><h2>Common Boiler Entry</h2></div><div class="toolbar"><div class="field"><label>Total Steam Produced</label><input id="steamProduced" class="input" type="number" step="0.001"></div><div class="field"><label>Steam to Pulp</label><input id="steamPulp" class="input" type="number" step="0.001"></div><div class="field"><label>Steam to PM-1</label><input id="steamPm1" class="input" type="number" step="0.001"></div><div class="field"><label>Steam to PM-2</label><input id="steamPm2" class="input" type="number" step="0.001"></div><div class="field"><label>Steam to PM-3</label><input id="steamPm3" class="input" type="number" step="0.001"></div><div class="field"><label>Self-use / Loss</label><input id="steamLoss" class="input" type="number" step="0.001"></div></div><div id="boilerTable"></div></section>
<section id="pm1" class="panel tab-pane"></section><section id="pm2" class="panel tab-pane"></section><section id="pm3" class="panel tab-pane"></section><div id="entryStatus" class="status">Ready.</div></main><script>
const mats=CostingV2.materials().filter(x=>!x.system&&x.active!==false);entryDate.value=new Date().toISOString().slice(0,10);const num=v=>CostingV2.n(v);function materialTable(group,unitKey){const list=mats.filter(m=>m.group===group);return `<div class="table-wrap" style="margin-top:12px"><table class="data-table" style="min-width:760px"><thead><tr><th>Material</th><th>Unit</th><th>Opening</th><th>Received</th><th>Actual Consumption</th><th>Standard Yield %</th><th>Expected Output</th></tr></thead><tbody>${list.map(m=>`<tr><td>${m.name}</td><td>${m.unit}</td><td><input data-m="${m.id}" data-u="${unitKey}" data-k="opening" type="number" step="0.001"></td><td><input data-m="${m.id}" data-u="${unitKey}" data-k="received" type="number" step="0.001"></td><td><input data-m="${m.id}" data-u="${unitKey}" data-k="consumed" type="number" step="0.001"></td><td>${m.standardYield||'-'}</td><td data-output="${m.id}-${unitKey}">0.000</td></tr>`).join('')}</tbody></table></div>`}
pulpTable.innerHTML=materialTable('Pulp','pulp');boilerTable.innerHTML=materialTable('Steam','boiler');function pmPane(id,label){const groups=['Ash (Filler)','Binder','Color','Coating','Recycle','Chemicals'];const list=mats.filter(m=>groups.includes(m.group));document.getElementById(id).innerHTML=`<div class="panel-title"><h2>${label} Entry</h2></div><div class="toolbar"><div class="field"><label>Paper Production (Ton)</label><input id="${id}Prod" class="input" type="number" step="0.001"></div><div class="field"><label>Ash Average %</label><input id="${id}Ash" class="input" type="number" step="0.01"></div><div class="field"><label>WAPDA (kWh)</label><input id="${id}Wapda" class="input" type="number" step="0.001"></div><div class="field"><label>Solar (kWh)</label><input id="${id}Solar" class="input" type="number" step="0.001"></div><div class="field"><label>Pulp Consumed</label><input id="${id}Pulp" class="input" type="number" step="0.001"></div><div class="field"><label>Steam Consumed</label><input id="${id}Steam" class="input" type="number" step="0.001"></div></div><div class="table-wrap" style="margin-top:12px"><table class="data-table" style="min-width:720px"><thead><tr><th>Material</th><th>Group</th><th>Unit</th><th>Actual Consumption</th><th>Applied Rate</th><th>Consumption Value</th></tr></thead><tbody>${list.map(m=>`<tr><td>${m.name}</td><td>${m.group}</td><td>${m.unit}</td><td><input data-m="${m.id}" data-u="${id}" data-k="consumed" type="number" step="0.001"></td><td data-rate="${m.id}-${id}">0.00</td><td data-value="${m.id}-${id}">0.00</td></tr>`).join('')}</tbody></table></div>`}pmPane('pm1','PM-1');pmPane('pm2','PM-2');pmPane('pm3','PM-3');
tabs.onclick=e=>{if(!e.target.dataset.tab)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===e.target));document.querySelectorAll('.tab-pane').forEach(x=>x.classList.toggle('active',x.id===e.target.dataset.tab))};document.body.addEventListener('input',e=>{if(!e.target.dataset.m)return;const m=mats.find(x=>x.id===e.target.dataset.m),u=e.target.dataset.u,q=num(e.target.value),rate=CostingV2.effectiveRate(m.id,entryDate.value)?.rate||0;const o=document.querySelector(`[data-output="${m.id}-${u}"]`);if(o)o.textContent=(q*num(m.standardYield)/100).toFixed(3);const rv=document.querySelector(`[data-rate="${m.id}-${u}"]`),vv=document.querySelector(`[data-value="${m.id}-${u}"]`);if(rv)rv.textContent=Number(rate).toLocaleString();if(vv)vv.textContent=(q*rate).toLocaleString(undefined,{maximumFractionDigits:2})});
function collect(){const materials={};document.querySelectorAll('[data-m][data-k]').forEach(i=>{const id=i.dataset.m,u=i.dataset.u,k=i.dataset.k;materials[id]??={};if(k==='opening'||k==='received')materials[id][k]=num(i.value);else materials[id][u]=num(i.value)});const pm=id=>({production:num(window[id+'Prod'].value),ash:num(window[id+'Ash'].value),wapda:num(window[id+'Wapda'].value),solar:num(window[id+'Solar'].value),pulp:num(window[id+'Pulp'].value),steam:num(window[id+'Steam'].value)});return {date:entryDate.value,pulp:{produced:num(pulpProduced.value),steam:num(pulpSteam.value),electricity:num(pulpElec.value)},boiler:{steamProduced:num(steamProduced.value),steamPulp:num(steamPulp.value),steamPm1:num(steamPm1.value),steamPm2:num(steamPm2.value),steamPm3:num(steamPm3.value),loss:num(steamLoss.value)},pm1:pm('pm1'),pm2:pm('pm2'),pm3:pm('pm3'),materials}}saveDaily.onclick=()=>{if(!entryDate.value)return alert('Select date.');CostingV2.saveDaily(collect());entryStatus.textContent='Daily production data saved successfully.'};loadDaily.onclick=()=>{const e=CostingV2.entries().find(x=>x.date===entryDate.value);if(!e)return entryStatus.textContent='No saved entry for this date.';entryStatus.textContent='Existing entry loaded. You may edit and save again.';pulpProduced.value=e.pulp?.produced||0;pulpSteam.value=e.pulp?.steam||0;pulpElec.value=e.pulp?.electricity||0;steamProduced.value=e.boiler?.steamProduced||0;steamPulp.value=e.boiler?.steamPulp||0;steamPm1.value=e.boiler?.steamPm1||0;steamPm2.value=e.boiler?.steamPm2||0;steamPm3.value=e.boiler?.steamPm3||0;steamLoss.value=e.boiler?.loss||0;['pm1','pm2','pm3'].forEach(id=>{const p=e[id]||{};window[id+'Prod'].value=p.production||0;window[id+'Ash'].value=p.ash||0;window[id+'Wapda'].value=p.wapda||0;window[id+'Solar'].value=p.solar||0;window[id+'Pulp'].value=p.pulp||0;window[id+'Steam'].value=p.steam||0});document.querySelectorAll('[data-m][data-k]').forEach(i=>{const d=e.materials?.[i.dataset.m]||{};i.value=i.dataset.k==='consumed'?(d[i.dataset.u]||0):(d[i.dataset.k]||0);i.dispatchEvent(new Event('input',{bubbles:true}))})};
</script></body></html>
