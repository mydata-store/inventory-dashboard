<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Masters</title>
<style>html,body{margin:0;min-height:100%;background:#eef8f3}body{visibility:hidden}</style>
</head>
<body>
<script>
(async function(){
  const CORE_URL='design-studio-core';
  const CACHE='erp-shared-core-v1';
  let html='';
  try{
    const res=await fetch(CORE_URL,{cache:'no-store'});
    if(!res.ok)throw new Error('Core fetch '+res.status);
    html=await res.text();
    try{const c=await caches.open(CACHE);await c.put(CORE_URL,new Response(html,{headers:{'Content-Type':'text/html'}}))}catch(e){}
  }catch(err){
    try{const c=await caches.open(CACHE),res=await c.match(CORE_URL);if(res)html=await res.text()}catch(e){}
  }
  if(!html){
    document.body.style.visibility='visible';
    document.body.innerHTML='<div style="padding:30px;font:16px Segoe UI,Arial">Design Studio Core could not be loaded. Open Design Studio once while online, then reopen Masters.</div>';
    return;
  }
  const css="\n/* Masters-only content styles. ERP shell/sidebar/header come from design-studio-core. */\n.master-page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}\n.master-page-head h2{margin:0 0 4px}.master-page-head p{margin:0;color:var(--muted)}\n.master-controller-btn{height:32px;padding:0 10px;font-size:10px}\n.master-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}\n.master-tab{height:34px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:0 11px;font-size:10px;font-weight:900;cursor:pointer}\n.master-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}\n.master-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}\n.master-kpi{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:12px}\n.master-kpi small{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}\n.master-kpi strong{display:block;font-size:21px;margin-top:5px}\n.master-toolbar{display:grid;grid-template-columns:minmax(230px,1.4fr) minmax(170px,.7fr) auto;gap:9px;align-items:end;margin-bottom:12px}\n.master-toolbar label,.master-form label{display:block;font-size:9px;font-weight:900;text-transform:uppercase;color:var(--muted);margin-bottom:4px}\n.master-toolbar input,.master-toolbar select,.master-form input,.master-form select,.master-form textarea{width:100%;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:9px}\n.master-toolbar input,.master-toolbar select,.master-form input,.master-form select{height:39px}\n.master-form textarea{min-height:72px;resize:vertical}\n.master-layout{display:grid;grid-template-columns:minmax(330px,.72fr) minmax(640px,1.28fr);gap:12px;align-items:start}\n.master-box{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:14px}\n.master-box h3{margin:0 0 10px}\n.master-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}\n.master-form .full{grid-column:1/-1}\n.master-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}\n.master-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;max-height:620px}\n.master-table{width:100%;border-collapse:collapse;min-width:900px}\n.master-table th,.master-table td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;font-size:10px}\n.master-table th{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 70%,var(--surface));font-size:9px;text-transform:uppercase}\n.master-table.compact th,.master-table.compact td{padding-top:5px;padding-bottom:5px}\n.master-mini{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:9px;font-weight:900;padding:0 8px;cursor:pointer}\n.master-mini.danger{color:#b91c1c;border-color:#fecaca;background:#fff7f7}\n.master-empty{text-align:center;padding:30px!important;color:var(--muted)}\n.master-modal{position:fixed;inset:0;background:rgba(8,20,35,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:900}\n.master-modal.open{display:flex}\n.master-modal-box{width:min(720px,96vw);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}\n.master-modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.master-modal-head h3{margin:0}\n.master-controller-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.master-controller-grid label{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:11px;font-weight:800}\n.master-controller-grid input{width:18px;height:18px}\n.master-business-nav{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--side-row,42px);padding:0 10px;border:0;border-radius:var(--side-radius,9px);background:var(--side-active);color:var(--side-active-text);font:inherit;font-weight:700;text-align:left}\n.master-design-link{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--side-row,42px);padding:0 10px;margin-bottom:8px;border-radius:var(--side-radius,9px);color:var(--side-text);text-decoration:none;font-weight:700}\n.master-design-link:hover{background:color-mix(in srgb,var(--side-active) 40%,transparent)}\n@media(max-width:1050px){.master-layout{grid-template-columns:1fr}.master-summary{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:650px){.master-summary,.master-toolbar,.master-form,.master-controller-grid{grid-template-columns:1fr}.master-form .full{grid-column:auto}}\n";
  const markup="\n<div class=\"card\">\n  <div class=\"master-page-head\">\n    <div><h2>All Masters</h2><p id=\"masterPageSubtitle\">Single source for item, supplier, department and supporting ERP master data.</p></div>\n    <button class=\"btn master-controller-btn\" id=\"masterPageControllerBtn\" type=\"button\">\u2699 Page Controller</button>\n  </div>\n  <div class=\"notice\" id=\"masterInstruction\" style=\"margin:12px 0\"><b>Master rule:</b> create master records here once, then Purchase, Issue, Gate Pass, Boiler, Costing and reports can reuse the same data.</div>\n  <div class=\"master-tabs\" id=\"masterTabs\"></div>\n  <div class=\"master-summary\" id=\"masterSummary\">\n    <div class=\"master-kpi\"><small>Current Master</small><strong id=\"masterKpiCurrent\">Items</strong></div>\n    <div class=\"master-kpi\"><small>Records</small><strong id=\"masterKpiRecords\">0</strong></div>\n    <div class=\"master-kpi\"><small>Active</small><strong id=\"masterKpiActive\">0</strong></div>\n    <div class=\"master-kpi\"><small>Company</small><strong id=\"masterKpiCompany\">\u2014</strong></div>\n  </div>\n  <div class=\"master-toolbar\" id=\"masterFilters\">\n    <div><label>Search Current Master</label><input id=\"masterSearch\" placeholder=\"Type name, code, department, phone...\"></div>\n    <div><label>Status</label><select id=\"masterStatusFilter\"><option value=\"\">All Status</option><option value=\"active\">Active</option><option value=\"inactive\">Inactive</option></select></div>\n    <div><button class=\"btn\" id=\"masterClearSearch\" type=\"button\">Clear</button></div>\n  </div>\n  <div class=\"master-layout\">\n    <div class=\"master-box\"><h3 id=\"masterFormTitle\">Add Item</h3><div class=\"master-form\" id=\"masterForm\"></div><div class=\"master-actions\"><button class=\"btn primary\" id=\"masterSaveBtn\" type=\"button\">Save</button><button class=\"btn\" id=\"masterClearBtn\" type=\"button\">Clear Form</button></div></div>\n    <div class=\"master-box\"><h3 id=\"masterListTitle\">Item List</h3><div class=\"master-table-wrap\"><table class=\"master-table\" id=\"masterTable\"><thead id=\"masterTableHead\"></thead><tbody id=\"masterTableBody\"></tbody></table></div></div>\n  </div>\n</div>\n<div class=\"master-modal\" id=\"masterPageControllerModal\">\n  <div class=\"master-modal-box\">\n    <div class=\"master-modal-head\"><h3>Page Controller \u2014 All Masters</h3><button class=\"btn\" id=\"masterPageControllerClose\" type=\"button\">Close</button></div>\n    <div class=\"master-controller-grid\">\n      <label>Show subtitle <input type=\"checkbox\" id=\"mpcSubtitle\"></label>\n      <label>Show instruction box <input type=\"checkbox\" id=\"mpcInstruction\"></label>\n      <label>Show summary cards <input type=\"checkbox\" id=\"mpcSummary\"></label>\n      <label>Show search / filters <input type=\"checkbox\" id=\"mpcFilters\"></label>\n      <label>Compact table rows <input type=\"checkbox\" id=\"mpcCompact\"></label>\n      <label>Show row numbers <input type=\"checkbox\" id=\"mpcRows\"></label>\n    </div>\n    <div class=\"master-actions\"><button class=\"btn primary\" id=\"masterPageControllerSave\" type=\"button\">Save Page Settings</button><button class=\"btn\" id=\"masterPageControllerReset\" type=\"button\">Restore Defaults</button></div>\n  </div>\n</div>\n";
  const js="\nconst MASTER_KEY='erpMasterDataV1',MASTER_PAGE_SETTINGS_KEY='erpPageSettings:all-masters';\nconst MASTER_TYPES={\n items:{name:'Items',singular:'Item',code:'ITM',fields:[['name','Item Name','text',true],['size','Size','text'],['unit','Unit','text'],['category','Category','text'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Item Name'],['size','Size'],['unit','Unit'],['category','Category'],['status','Status']]},\n suppliers:{name:'Suppliers',singular:'Supplier',code:'SUP',fields:[['name','Supplier Name','text',true],['proprietor','Proprietor','text'],['phone','Phone','text'],['address','Address','textarea'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Supplier'],['proprietor','Proprietor'],['phone','Phone'],['address','Address'],['status','Status']]},\n departments:{name:'Departments',singular:'Department',code:'DEP',fields:[['name','Department Name','text',true],['signatureAuthority','Signature Authority','text'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Department'],['signatureAuthority','Signature Authority'],['status','Status']]},\n units:{name:'Units',singular:'Unit',code:'UNT',fields:[['name','Unit Name','text',true],['shortName','Short Name','text'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Unit Name'],['shortName','Short Name'],['status','Status']]},\n workshops:{name:'Workshops / Parties',singular:'Workshop / Party',code:'WSP',fields:[['name','Workshop / Party Name','text',true],['contactPerson','Contact Person','text'],['phone','Phone','text'],['address','Address','textarea'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Workshop / Party'],['contactPerson','Contact Person'],['phone','Phone'],['address','Address'],['status','Status']]},\n categories:{name:'Categories',singular:'Category',code:'CAT',fields:[['name','Category Name','text',true],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Category'],['status','Status']]},\n carriers:{name:'Carriers',singular:'Carrier',code:'CAR',fields:[['name','Carrier Name','text',true],['phone','Phone','text'],['vehicleNo','Vehicle No','text'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Carrier'],['phone','Phone'],['vehicleNo','Vehicle No'],['status','Status']]},\n authorization:{name:'Authorization',singular:'Authorization',code:'AUT',fields:[['name','Authorized Person','text',true],['designation','Designation','text'],['department','Department','text'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Authorized Person'],['designation','Designation'],['department','Department'],['status','Status']]},\n employees:{name:'Employees',singular:'Employee',code:'EMP',fields:[['name','Employee Name','text',true],['employeeCode','Employee Code','text'],['department','Department','text'],['designation','Designation','text'],['phone','Phone','text'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Employee'],['employeeCode','Employee Code'],['department','Department'],['designation','Designation'],['phone','Phone'],['status','Status']]},\n vehicles:{name:'Vehicles',singular:'Vehicle',code:'VEH',fields:[['name','Vehicle No.','text',true],['vehicleType','Vehicle Type','text'],['driver','Driver / Carrier','text'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Vehicle No.'],['vehicleType','Type'],['driver','Driver / Carrier'],['status','Status']]},\n locations:{name:'Locations / Racks',singular:'Location / Rack',code:'LOC',fields:[['name','Location / Rack','text',true],['department','Department','text'],['description','Description','textarea'],['status','Status','select',false,['active','inactive']]],columns:[['code','Code'],['name','Location / Rack'],['department','Department'],['description','Description'],['status','Status']]}\n};\nlet masterCurrent='items',masterEditingId='';\nfunction masterCap(v){return String(v||'').trim().replace(/\\s+/g,' ').replace(/\\b\\w/g,c=>c.toUpperCase())}\nfunction masterTenantId(){return window.ERPTenant?.currentId?.()||'local'}\nfunction masterLoadAll(){try{return JSON.parse(localStorage.getItem(MASTER_KEY)||'{}')||{}}catch(e){return{}}}\nfunction masterRows(type=masterCurrent){const d=masterLoadAll(),t=masterTenantId();return Array.isArray(d[t]?.[type])?d[t][type]:[]}\nfunction masterWrite(type,rows){const d=masterLoadAll(),t=masterTenantId();d[t]=d[t]||{};d[t][type]=rows;localStorage.setItem(MASTER_KEY,JSON.stringify(d));window.ERPCore?.markPending?.(1)}\nfunction masterNextCode(type){const cfg=MASTER_TYPES[type],n=masterRows(type).reduce((m,r)=>Math.max(m,+String(r.code||'').replace(/\\D/g,'')||0),0)+1;return `${cfg.code}-${String(n).padStart(5,'0')}`}\nfunction masterSettings(){const def={subtitle:true,instruction:true,summary:true,filters:true,compact:false,rows:true};try{return {...def,...JSON.parse(localStorage.getItem(MASTER_PAGE_SETTINGS_KEY)||'{}')}}catch(e){return def}}\nfunction masterApplySettings(){const x=masterSettings();$('#masterPageSubtitle').style.display=x.subtitle?'':'none';$('#masterInstruction').style.display=x.instruction?'':'none';$('#masterSummary').style.display=x.summary?'grid':'none';$('#masterFilters').style.display=x.filters?'grid':'none';$('#masterTable').classList.toggle('compact',!!x.compact);$('#mpcSubtitle').checked=x.subtitle;$('#mpcInstruction').checked=x.instruction;$('#mpcSummary').checked=x.summary;$('#mpcFilters').checked=x.filters;$('#mpcCompact').checked=x.compact;$('#mpcRows').checked=x.rows}\nfunction masterRenderTabs(){$('#masterTabs').innerHTML=Object.entries(MASTER_TYPES).map(([id,x])=>`<button class=\"master-tab ${id===masterCurrent?'active':''}\" data-master-type=\"${id}\">${escHtml(x.name)}</button>`).join('');$$('[data-master-type]').forEach(b=>b.onclick=()=>{masterCurrent=b.dataset.masterType;masterEditingId='';masterRenderAll()})}\nfunction masterRenderForm(){const cfg=MASTER_TYPES[masterCurrent];$('#masterFormTitle').textContent=(masterEditingId?'Edit ':'Add ')+cfg.singular;$('#masterForm').innerHTML=cfg.fields.map(([k,l,t,req,opts])=>t==='select'?`<div><label>${escHtml(l)}${req?' *':''}</label><select data-master-field=\"${k}\">${(opts||[]).map(o=>`<option value=\"${o}\">${masterCap(o)}</option>`).join('')}</select></div>`:t==='textarea'?`<div class=\"full\"><label>${escHtml(l)}${req?' *':''}</label><textarea data-master-field=\"${k}\"></textarea></div>`:`<div><label>${escHtml(l)}${req?' *':''}</label><input data-master-field=\"${k}\"></div>`).join('')}\nfunction masterFiltered(){const q=($('#masterSearch').value||'').toLowerCase().trim(),st=$('#masterStatusFilter').value;return masterRows().filter(r=>(!st||r.status===st)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q))).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))}\nfunction masterRenderTable(){const cfg=MASTER_TYPES[masterCurrent],x=masterSettings(),a=masterFiltered();$('#masterListTitle').textContent=cfg.name+' List';$('#masterTableHead').innerHTML='<tr>'+(x.rows?'<th>#</th>':'')+cfg.columns.map(c=>`<th>${escHtml(c[1])}</th>`).join('')+'<th>Action</th></tr>';$('#masterTableBody').innerHTML=a.length?a.map((r,i)=>'<tr>'+(x.rows?`<td>${i+1}</td>`:'')+cfg.columns.map(([k])=>`<td>${escHtml(r[k]??'')}</td>`).join('')+`<td><button class=\"master-mini\" onclick=\"masterEdit('${r.id}')\">Edit</button> <button class=\"master-mini danger\" onclick=\"masterDelete('${r.id}')\">Delete</button></td></tr>`).join(''):`<tr><td colspan=\"${cfg.columns.length+(x.rows?2:1)}\" class=\"master-empty\">No records found.</td></tr>`}\nfunction masterRenderSummary(){const a=masterRows(),t=window.ERPTenant?.current?.();$('#masterKpiCurrent').textContent=MASTER_TYPES[masterCurrent].name;$('#masterKpiRecords').textContent=a.length;$('#masterKpiActive').textContent=a.filter(x=>x.status!=='inactive').length;$('#masterKpiCompany').textContent=t?.shortCode||t?.name||'Local'}\nfunction masterRenderAll(){masterRenderTabs();masterRenderForm();masterRenderTable();masterRenderSummary();masterApplySettings()}\nfunction masterReadForm(){const o={};for(const [k,l,t,req] of MASTER_TYPES[masterCurrent].fields){const e=$(`[data-master-field=\"${k}\"]`);let v=e?.value??'';if(t!=='select')v=masterCap(v);if(req&&!v.trim()){toast(l+' is required');return null}o[k]=v}if(!o.status)o.status='active';return o}\nfunction masterDuplicate(a,d,id=''){if(masterCurrent==='items')return a.some(r=>r.id!==id&&String(r.name).toLowerCase()===String(d.name).toLowerCase()&&String(r.size||'').toLowerCase()===String(d.size||'').toLowerCase());return a.some(r=>r.id!==id&&String(r.name).toLowerCase()===String(d.name).toLowerCase())}\nfunction masterSave(){if(!ERPAccessControl?.canPage?.('all-masters',masterEditingId?'edit':'add'))return toast('You do not have permission for this action');const d=masterReadForm();if(!d)return;const a=masterRows();if(masterDuplicate(a,d,masterEditingId))return toast(masterCurrent==='items'?'Item name + size already exists':'This master name already exists');const now=new Date().toISOString(),u=ERPAccessControl?.currentUser?.();if(masterEditingId){const i=a.findIndex(x=>x.id===masterEditingId),before={...a[i]};a[i]={...a[i],...d,updatedAt:now,updatedBy:u?.id||''};masterWrite(masterCurrent,a);ERPAudit?.log?.({module:'Masters',page:MASTER_TYPES[masterCurrent].name,action:'Edit',recordId:a[i].code,before,after:a[i]})}else{const r={id:'M-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),code:masterNextCode(masterCurrent),tenantId:masterTenantId(),...d,createdAt:now,updatedAt:now,createdBy:u?.id||''};a.push(r);masterWrite(masterCurrent,a);ERPAudit?.log?.({module:'Masters',page:MASTER_TYPES[masterCurrent].name,action:'Add',recordId:r.code,after:r})}masterEditingId='';masterRenderAll();toast('Master record saved')}\nfunction masterEdit(id){if(!ERPAccessControl?.canPage?.('all-masters','edit'))return toast('You do not have edit permission');const r=masterRows().find(x=>x.id===id);if(!r)return;masterEditingId=id;masterRenderForm();MASTER_TYPES[masterCurrent].fields.forEach(([k])=>{const e=$(`[data-master-field=\"${k}\"]`);if(e)e.value=r[k]??''});$('#masterFormTitle').textContent='Edit '+MASTER_TYPES[masterCurrent].singular;scrollTo({top:0,behavior:'smooth'})}\nfunction masterDelete(id){if(!ERPAccessControl?.canPage?.('all-masters','delete'))return toast('You do not have delete permission');const a=masterRows(),r=a.find(x=>x.id===id);if(!r||!confirm(`Delete ${r.name||r.code}?`))return;masterWrite(masterCurrent,a.filter(x=>x.id!==id));ERPAudit?.log?.({module:'Masters',page:MASTER_TYPES[masterCurrent].name,action:'Delete',recordId:r.code,before:r});masterRenderAll();toast('Master record deleted')}\nfunction masterInit(){\n  ERPAccessControl?.registerPage?.({id:'all-masters',name:'All Masters',module:'masters',actions:['view','add','edit','delete','print'],description:'Central ERP master data'});\n  const allowed=ERPAccessControl?.canPage?.('all-masters','view');\n  const main=document.querySelector('main.content'); if(!main)return;\n  if(!allowed){main.innerHTML='<div class=\"card\"><h2>Access Denied</h2><p class=\"sub\">You do not have permission to open All Masters.</p></div>';return}\n  main.innerHTML=MASTER_MARKUP;\n  $('#workspaceTitle').textContent='Masters';$('#workspaceSubtitle').textContent='Central master data connected to Design Studio Core.';\n  const actions=document.querySelector('.top .actions');if(actions)actions.style.display='none';\n  const group=$('#designStudioGroup');if(group)group.style.display='none';\n  const note=document.querySelector('.core-menu-note');if(note)note.style.display='none';\n  const menu=$('#sideMenu');if(menu){const b=document.createElement('button');b.className='master-business-nav';b.type='button';b.innerHTML='<span class=\"side-icon\">\u25a6</span><span>Masters</span>';menu.prepend(b)}\n  const bottom=document.querySelector('.side-bottom');if(bottom){const a=document.createElement('a');a.className='master-design-link';a.href='design-studio-core';a.innerHTML='<span class=\"side-icon\">\u25c6</span><span>Design Studio</span>';const u=ERPAccessControl?.currentUser?.();if(u?.role!=='Super Administrator'&&!ERPAccessControl?.can?.('design','view'))a.style.display='none';bottom.prepend(a)}\n  $('#masterSearch').oninput=masterRenderTable;$('#masterStatusFilter').onchange=masterRenderTable;$('#masterClearSearch').onclick=()=>{$('#masterSearch').value='';$('#masterStatusFilter').value='';masterRenderTable()};\n  $('#masterSaveBtn').onclick=masterSave;$('#masterClearBtn').onclick=()=>{masterEditingId='';masterRenderForm()};\n  $('#masterPageControllerBtn').onclick=()=>{$('#masterPageControllerModal').classList.add('open');masterApplySettings()};$('#masterPageControllerClose').onclick=()=>$('#masterPageControllerModal').classList.remove('open');$('#masterPageControllerModal').onclick=e=>{if(e.target===$('#masterPageControllerModal'))$('#masterPageControllerModal').classList.remove('open')};\n  $('#masterPageControllerSave').onclick=()=>{localStorage.setItem(MASTER_PAGE_SETTINGS_KEY,JSON.stringify({subtitle:$('#mpcSubtitle').checked,instruction:$('#mpcInstruction').checked,summary:$('#mpcSummary').checked,filters:$('#mpcFilters').checked,compact:$('#mpcCompact').checked,rows:$('#mpcRows').checked}));$('#masterPageControllerModal').classList.remove('open');masterRenderAll();toast('Page settings saved')};\n  $('#masterPageControllerReset').onclick=()=>{localStorage.removeItem(MASTER_PAGE_SETTINGS_KEY);masterRenderAll();toast('Page defaults restored')};\n  masterRenderAll();\n}\nmasterInit();\n";
  html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>ERP Masters</title>');
  html=html.replace('</head>','<style>'+css+'</style><style>html.erp-master-loading body{visibility:hidden!important}</style><script>document.documentElement.classList.add("erp-master-loading");<\/script></head>');
  html=html.replace('</body>','<script>const MASTER_MARKUP='+JSON.stringify(markup)+';'+js+';document.documentElement.classList.remove("erp-master-loading");<\/script></body>');
  document.open();document.write(html);document.close();
})();
</script>
</body>
</html>
